<!DOCTYPE html>
<html lang="fr" dir="ltr" id="appHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVibe PRO - NextGen IPTV Experience</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- HLS & Three.js Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --bg-main: #05070b;
            --bg-card: #0f1624;
            --bg-glass: rgba(15, 22, 36, 0.75);
            --primary-blue: #00d2ff;
            --primary-glow: rgba(0, 210, 255, 0.4);
            --btn-settings: #e50914;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --border-subtle: rgba(255, 255, 255, 0.1);
        }

        [data-theme="neon"] {
            --primary-blue: #ff007f;
            --primary-glow: rgba(255, 0, 127, 0.4);
            --btn-settings: #d60060;
        }

        [data-theme="cyber"] {
            --primary-blue: #00ffcc;
            --primary-glow: rgba(0, 255, 204, 0.4);
            --btn-settings: #0088cc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Tajawal', sans-serif;
            user-select: none;
            outline: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 50px;
        }

        #webgl-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        /* شريط التنقل العلوي الاحترافي */
        .top-navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 40px;
            background: rgba(5, 7, 11, 0.9);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-subtle);
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
        }

        .brand-logo-3d {
            font-size: 26px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary-blue), #3a7bd5, #ff0055);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-badge {
            background: linear-gradient(135deg, #ff0055, #ff5050);
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            -webkit-text-fill-color: #fff;
        }

        .server-status-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            color: #10b981;
        }

        .green-dot {
            width: 8px; height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981;
            animation: pulse-green 1.5s infinite;
        }

        @keyframes pulse-green {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .nav-center {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.03);
            padding: 6px;
            border-radius: 30px;
            border: 1px solid var(--border-subtle);
        }

        .nav-pill {
            background: transparent;
            border: none;
            color: var(--text-sub);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-pill.active, .nav-pill:hover {
            background: var(--primary-blue);
            color: #05070b;
            font-weight: 800;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .icon-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: #fff;
            width: 44px; height: 44px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; cursor: pointer;
            transition: 0.2s;
        }

        .icon-btn:hover {
            background: var(--primary-blue);
            color: #05070b;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        /* عرض الأقسام */
        .view-section {
            display: none;
            padding: 30px 40px;
        }

        .view-section.active { display: block; }

        /* بانر الاستقبال السينمائي */
        .hero-banner-large {
            position: relative;
            width: 100%;
            min-height: 280px;
            border-radius: 24px;
            overflow: hidden;
            background: linear-gradient(180deg, rgba(5, 7, 11, 0.2) 0%, rgba(5, 7, 11, 0.95) 100%),
                        url('https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?q=80&w=1400&auto=format&fit=crop') center/cover no-repeat;
            border: 1px solid var(--border-subtle);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            margin-bottom: 35px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
        }

        .hero-banner-title {
            font-size: 38px;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ffffff, var(--primary-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-banner-sub {
            color: var(--text-sub);
            font-size: 15px;
            max-width: 650px;
            line-height: 1.5;
        }

        /* شبكة الأقسام السريعة */
        .quick-categories-grid-large {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .category-card-large {
            height: 200px;
            border-radius: 18px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            border: 1px solid var(--border-subtle);
            background: var(--bg-card);
            transition: all 0.3s ease;
        }

        .category-card-large:hover {
            transform: translateY(-8px);
            border-color: var(--primary-blue);
            box-shadow: 0 15px 30px var(--primary-glow);
        }

        .category-card-large img {
            width: 100%; height: 100%;
            object-fit: cover;
            filter: brightness(0.6);
            transition: 0.3s;
        }

        .category-card-large:hover img { filter: brightness(0.8); }

        .category-card-overlay-large {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            padding: 20px;
            background: linear-gradient(180deg, transparent 0%, rgba(5,7,11,0.95) 100%);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .category-card-overlay-large i { font-size: 24px; color: var(--primary-blue); }
        .category-card-overlay-large span { font-size: 18px; font-weight: 800; color: #fff; }

        /* شبكة الأفلام والمسلسلات */
        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .media-card {
            background: var(--bg-card);
            border-radius: 14px; overflow: hidden;
            border: 1px solid var(--border-subtle);
            cursor: pointer; transition: 0.25s;
        }

        .media-card:hover { transform: translateY(-5px); border-color: var(--primary-blue); box-shadow: 0 10px 25px var(--primary-glow); }
        .media-card img { width: 100%; height: 230px; object-fit: cover; }
        .media-card-body { padding: 14px; }

        /* 📺 تصميم شاشة البث الحي وجدول القنوات الفاخر */
        .live-layout {
            display: grid;
            grid-template-columns: 440px 1fr;
            gap: 25px;
            align-items: start;
        }

        .player-preview-card {
            background: var(--bg-card);
            border-radius: 20px; 
            overflow: hidden;
            border: 1px solid var(--border-subtle);
            position: sticky; 
            top: 100px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        .video-box { 
            width: 100%; 
            height: 260px; 
            background: #000; 
            position: relative; 
        }
        
        .video-box video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }

        /* شريط تصفية البلدان المتقدم */
        .filter-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            background: var(--bg-card);
            padding: 14px 22px;
            border-radius: 16px;
            border: 1px solid var(--border-subtle);
        }

        .filter-bar select {
            background: #05070b;
            color: #fff;
            border: 1px solid var(--border-subtle);
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        /* جدول وشبكة القنوات */
        .channels-pro-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 14px;
            max-height: 72vh;
            overflow-y: auto;
            padding-right: 6px;
        }

        .channels-pro-grid::-webkit-scrollbar { width: 6px; }
        .channels-pro-grid::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); border-radius: 10px; }
        .channels-pro-grid::-webkit-scrollbar-thumb { background: var(--primary-blue); border-radius: 10px; opacity: 0.6; }

        .channel-pro-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px; 
            padding: 14px 16px;
            display: flex; 
            align-items: center; 
            gap: 14px;
            cursor: pointer; 
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .channel-pro-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--primary-blue);
            opacity: 0;
            transition: 0.2s;
        }

        .channel-pro-card:hover { 
            border-color: var(--primary-blue); 
            background: rgba(15, 22, 36, 0.95);
            transform: translateY(-4px);
            box-shadow: 0 10px 25px var(--primary-glow);
        }

        .channel-pro-card:hover::before { opacity: 1; }

        .channel-pro-card.active-channel {
            border-color: var(--primary-blue);
            background: rgba(0, 210, 255, 0.12);
            box-shadow: 0 0 20px var(--primary-glow);
        }
        .channel-pro-card.active-channel::before { opacity: 1; }

        .channel-icon-badge {
            width: 44px; height: 44px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
            border: 1px solid var(--border-subtle);
        }

        .channel-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
        }

        .channel-name {
            font-size: 14px; 
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .channel-type {
            font-size: 11px;
            color: var(--text-sub);
        }

        /* نافذة الإعدادات الفاخرة */
        .settings-modal {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            z-index: 99999;
            display: none;
            align-items: center; justify-content: center;
        }

        .settings-modal.active { display: flex !important; }

        .settings-content {
            background: #0f1624;
            border: 1px solid var(--border-subtle);
            border-radius: 24px;
            padding: 30px;
            width: 90%; max-width: 480px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9);
            position: relative;
        }

        .settings-title-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .settings-title-bar h2 { font-size: 22px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 10px; }

        .close-settings {
            background: transparent; border: none;
            color: var(--text-sub); font-size: 22px;
            cursor: pointer;
        }

        .settings-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .settings-btn {
            background: var(--btn-settings);
            color: #fff; border: none;
            padding: 15px 20px; border-radius: 16px;
            font-size: 15px; font-weight: 700;
            display: flex; align-items: center; justify-content: space-between;
            cursor: pointer; transition: 0.2s;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.3);
            text-align: inherit; width: 100%;
        }

        .settings-btn:hover { opacity: 0.92; transform: scale(1.02); }
        .settings-btn-left { display: flex; align-items: center; gap: 15px; }

        .sub-setting-view {
            display: none;
            flex-direction: column;
            gap: 15px;
        }

        .sub-setting-view.active { display: flex; }

        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 13px; font-weight: 700; color: var(--text-sub); }
        .form-input, .form-select {
            width: 100%;
            background: #05070b;
            border: 1px solid var(--border-subtle);
            color: #fff;
            padding: 12px 15px;
            border-radius: 12px;
            font-size: 14px;
        }

        .btn-submit {
            background: var(--primary-blue);
            color: #05070b; border: none;
            padding: 14px; border-radius: 12px;
            font-weight: 800; font-size: 14px;
            cursor: pointer; margin-top: 10px;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .btn-back-settings {
            background: rgba(255, 255, 255, 0.08);
            color: #fff; border: none;
            padding: 8px 14px; border-radius: 10px;
            font-size: 13px; font-weight: 700;
            cursor: pointer; display: flex; align-items: center; gap: 6px;
        }

        @media (max-width: 900px) {
            .live-layout { grid-template-columns: 1fr; }
            .player-preview-card { position: relative; top: 0; }
            .top-navbar { padding: 12px 20px; }
        }
    </style>
</head>
<body>

    <canvas id="webgl-canvas"></canvas>

    <nav class="top-navbar">
        <div class="brand-container" onclick="switchView('homeView', this)">
            <div class="brand-logo-3d">
                <i class="fa-solid fa-play" style="color:var(--primary-blue);"></i> StreamVibe <span class="brand-badge">PRO</span>
            </div>
            <div class="server-status-pill">
                <span class="green-dot"></span>
                <span data-i18n="serverOnline">SERVER ONLINE</span>
            </div>
        </div>

        <div class="nav-center">
            <button class="nav-pill active" onclick="switchView('homeView', this)" data-i18n="navHome">page d'accueil</button>
            <button class="nav-pill" onclick="switchView('moviesView', this)" data-i18n="navMovies">Films</button>
            <button class="nav-pill" onclick="switchView('seriesView', this)" data-i18n="navSeries">Séries TV</button>
            <button class="nav-pill" onclick="switchView('animesView', this)" data-i18n="navAnimes">Animés</button>
            <button class="nav-pill" onclick="switchView('liveView', this)" data-i18n="navLive">TV en direct</button>
        </div>

        <div class="nav-right">
            <button class="icon-btn" onclick="openSettings()"><i class="fa-solid fa-gear"></i></button>
        </div>
    </nav>

    <!-- HOME VIEW -->
    <div id="homeView" class="view-section active">
        <div class="hero-banner-large">
            <h1 class="hero-banner-title" data-i18n="heroTitle">StreamVibe PRO - Universal Streaming</h1>
            <p class="hero-banner-sub" data-i18n="heroSub">Plateforme de streaming ultime. Découvrez les meilleurs films, séries, animés et chaînes télévisées en direct avec qualité Ultra HD.</p>
        </div>

        <div class="quick-categories-grid-large">
            <div class="category-card-large" onclick="switchView('moviesView', null)">
                <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=600&auto=format&fit=crop" alt="Films">
                <div class="category-card-overlay-large">
                    <i class="fa-solid fa-film"></i>
                    <span data-i18n="catMovies">Films</span>
                </div>
            </div>
            <div class="category-card-large" onclick="switchView('seriesView', null)">
                <img src="https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?q=80&w=600&auto=format&fit=crop" alt="Séries">
                <div class="category-card-overlay-large">
                    <i class="fa-solid fa-tv"></i>
                    <span data-i18n="catSeries">Séries TV</span>
                </div>
            </div>
            <div class="category-card-large" onclick="switchView('liveView', null)">
                <img src="https://images.unsplash.com/photo-1593784991095-a205069470b6?q=80&w=600&auto=format&fit=crop" alt="Live">
                <div class="category-card-overlay-large">
                    <i class="fa-solid fa-satellite-dish"></i>
                    <span data-i18n="catLive">TV en direct</span>
                </div>
            </div>
            <div class="category-card-large" onclick="switchView('animesView', null)">
                <img src="https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=600&auto=format&fit=crop" alt="Animés">
                <div class="category-card-overlay-large">
                    <i class="fa-solid fa
