
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101522">
<title>Nova TV</title>
<style>
:root {
  color-scheme: dark;
  --bg:#101522;
  --panel:#191f30;
  --panel2:#222b40;
  --text:#f5f7ff;
  --muted:#aab4ca;
  --accent:#58d6b0;
  --border:#303a50;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Tahoma,sans-serif;
  font-size:16px;
}
button,input,select { font:inherit; }
button { cursor:pointer; }
header {
  padding:22px max(16px,calc((100% - 1150px)/2));
  background:#171d2c;
  border-bottom:1px solid var(--border);
}
.brand { font-size:28px; font-weight:800; }
.brand span { color:var(--accent); }
.subtitle { color:var(--muted); margin-top:7px; }
main { max-width:1150px; margin:auto; padding:20px 16px 50px; }
.toolbar {
  display:flex; flex-wrap:wrap; gap:10px; margin-bottom:18px;
}
input,select {
  min-width:0;
  padding:13px;
  color:var(--text);
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
}
#search { flex:1 1 220px; }
button {
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px 16px;
  color:var(--text);
  background:var(--panel2);
}
button.primary { background:var(--accent); color:#09251d; font-weight:700; }
button:focus,input:focus,select:focus {
  outline:2px solid var(--accent);
  outline-offset:2px;
}
.status {
  padding:14px;
  margin:12px 0;
  background:var(--panel);
  color:var(--muted);
  border-radius:12px;
  overflow-wrap:anywhere;
}
.section-title {
  display:flex; align-items:center; justify-content:space-between;
  gap:10px; margin:24px 0 14px;
}
.section-title h2 { margin:0; font-size:21px; }
.countries {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(min(100%,245px),1fr));
  gap:12px;
}
.country {
  display:flex; align-items:center; gap:12px;
  width:100%; min-width:0; text-align:start;
  padding:15px; background:var(--panel);
  border:1px solid var(--border);
}
.country:hover { border-color:var(--accent); }
.flag { font-size:32px; flex-shrink:0; }
.country-info { flex:1; min-width:0; }
.country-name { display:block; font-weight:700; overflow-wrap:anywhere; }
.country-count { display:block; margin-top:5px; font-size:13px; color:var(--muted); }
.arrow { color:var(--accent); }
.channels {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));
  gap:12px;
}
.channel {
  min-width:0; padding:14px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
}
.channel-top { display:flex; align-items:center; gap:11px; min-width:0; }
.logo {
  width:54px; height:54px; flex-shrink:0;
  object-fit:contain; background:#fff; border-radius:10px;
}
.channel-info { min-width:0; flex:1; }
.channel-name { font-weight:700; overflow-wrap:anywhere; line-height:1.4; }
.channel-country { color:var(--muted); font-size:13px; margin-top:5px; }
.channel-actions { display:flex; gap:8px; margin-top:12px; }
.channel-actions button { flex:1; padding:10px 6px; }
.back { margin-bottom:15px; }
video {
  display:block; width:100%; max-height:65vh;
  background:#000; border-radius:14px; margin:12px 0;
}
.hidden { display:none !important; }
footer {
  text-align:center; color:var(--muted);
  padding:24px 16px; border-top:1px solid var(--border);
  font-size:13px;
}
@media(max-width:480px) {
  header { padding:18px 14px; }
  main { padding:14px 12px 35px; }
  .brand { font-size:25px; }
  .toolbar button { flex:1 1 auto; }
  .countries,.channels { grid-template-columns:minmax(0,1fr); }
}
</style>
</head>
<body>
<header>
  <div class="brand">NOVA <span>TV</span></div>
  <div class="subtitle" id="subtitle">قنوات العالم مرتبة حسب الدولة والعلم</div>
</header>

<main>
  <div class="toolbar">
    <input id="search" type="search" placeholder="ابحث عن دولة أو قناة..." aria-label="بحث">
    <select id="language" aria-label="لغة الواجهة">
      <option value="ar">العربية</option>
      <option value="fr">Français</option>
      <option value="en">English</option>
    </select>
    <button id="reload" class="primary">تحميل القنوات</button>
  </div>

  <div id="status" class="status" role="status">جارٍ تجهيز الصفحة...</div>

  <section id="countrySection">
    <div class="section-title">
      <h2 id="countryHeading">الدول</h2>
      <span id="countryCount"></span>
    </div>
    <div id="countries" class="countries"></div>
  </section>

  <section id="channelSection" class="hidden">
    <button id="back" class="back">← الدول</button>
    <div class="section-title">
      <h2 id="channelHeading">القنوات</h2>
      <span id="channelCount"></span>
    </div>
    <video id="player" controls playsinline class="hidden"></video>
    <div id="channels" class="channels"></div>
  </section>
</main>

<footer>
  Nova TV · قوائم IPTV العامة · قد لا تعمل بعض القنوات في جميع البلدان أو المتصفحات.
</footer>

<script>
(() => {
  "use strict";

  const PLAYLIST_URL =
    "https://iptv-org.github.io/iptv/index.country.m3u";

  const $ = id => document.getElementById(id);

  const text = {
    ar: {
      subtitle:"قنوات العالم مرتبة حسب الدولة والعلم",
      search:"ابحث عن دولة أو قناة...",
      load:"تحميل القنوات",
      loading:"جارٍ تحميل قائمة القنوات العالمية...",
      countries:"الدول",
      channels:"القنوات",
      back:"→ العودة إلى الدول",
      watch:"تشغيل",
      favorite:"☆ مفضلة",
      unfavorite:"★ مفضلة",
      all:"كل الدول",
      countCountries:n=>`${n} دولة`,
      countChannels:n=>`${n} قناة`,
      emptyCountries:"لم يتم العثور على دول مطابقة.",
      emptyChannels:"لا توجد قنوات مطابقة في هذه الدولة.",
      ready:n=>`تم تحميل ${n} قناة. اختر دولة لعرض قنواتها.`,
      error:"تعذر تحميل القائمة. تحقق من اتصال الإنترنت ثم اضغط تحميل القنوات.",
      noUrl:"لا يوجد رابط بث صالح لهذه القناة.",
      playing:"قد يبدأ البث بعد لحظات. بعض القنوات لا تدعم التشغيل داخل المتصفح.",
      favoriteTitle:"المفضلة"
    },
    fr: {
      subtitle:"Chaînes du monde classées par pays et drapeau",
      search:"Rechercher un pays ou une chaîne...",
      load:"Charger les chaînes",
      loading:"Chargement de la liste mondiale...",
      countries:"Pays",
      channels:"Chaînes",
      back:"→ Retour aux pays",
      watch:"Lire",
      favorite:"☆ Favori",
      unfavorite:"★ Favori",
      all:"Tous les pays",
      countCountries:n=>`${n} pays`,
      countChannels:n=>`${n} chaînes`,
      emptyCountries:"Aucun pays trouvé.",
      emptyChannels:"Aucune chaîne trouvée dans ce pays.",
      ready:n=>`${n} chaînes chargées. Choisissez un pays.`,
      error:"Impossible de charger la liste. Vérifiez Internet et réessayez.",
      noUrl:"Aucune URL de diffusion valide.",
      playing:"La lecture peut prendre un instant. Certaines chaînes ne fonctionnent pas dans le navigateur.",
      favoriteTitle:"Favoris"
    },
    en: {
      subtitle:"World channels grouped by country and flag",
      search:"Search countries or channels...",
      load:"Load channels",
      loading:"Loading the worldwide playlist...",
      countries:"Countries",
      channels:"Channels",
      back:"→ Back to countries",
      watch:"Play",
      favorite:"☆ Favorite",
      unfavorite:"★ Favorite",
      all:"All countries",
      countCountries:n=>`${n} countries`,
      countChannels:n=>`${n} channels`,
      emptyCountries:"No matching countries found.",
      emptyChannels:"No matching channels in this country.",
      ready:n=>`${n} channels loaded. Choose a country.`,
      error:"Could not load playlist. Check your connection and try again.",
      noUrl:"No valid stream URL for this channel.",
      playing:"Playback may take a moment. Some channels are not supported by browsers.",
      favoriteTitle:"Favorites"
    }
  };

  const knownCountries = {
    ad:["Andorra","أندورا","Andorre"],
    ae:["United Arab Emirates","الإمارات","Émirats arabes unis"],
    af:["Afghanistan","أفغانستان","Afghanistan"],
    al:["Albania","ألبانيا","Albanie"],
    dz:["Algeria","الجزائر","Algérie"],
    ar:["Argentina","الأرجنتين","Argentine"],
    at:["Austria","النمسا","Autriche"],
    au:["Australia","أستراليا","Australie"],
    az:["Azerbaijan","أذربيجان","Azerbaïdjan"],
    ba:["Bosnia and Herzegovina","البوسنة والهرسك","Bosnie-Herzégovine"],
    bd:["Bangladesh","بنغلاديش","Bangladesh"],
    be:["Belgium","بلجيكا","Belgique"],
    bh:["Bahrain","البحرين","Bahreïn"],
    br:["Brazil","البرازيل","Brésil"],
    ca:["Canada","كندا","Canada"],
    ch:["Switzerland","سويسرا","Suisse"],
    cn:["China","الصين","Chine"],
    co:["Colombia","كولومبيا","Colombie"],
    de:["Germany","ألمانيا","Allemagne"],
    dk:["Denmark","الدنمارك","Danemark"],
    eg:["Egypt","مصر","Égypte"],
    es:["Spain","إسبانيا","Espagne"],
    fi:["Finland","فنلندا","Finlande"],
    fr:["France","فرنسا","France"],
    gb:["United Kingdom","المملكة المتحدة","Royaume-Uni"],
    gr:["Greece","اليونان","Grèce"],
    hk:["Hong Kong","هونغ كونغ","Hong Kong"],
    id:["Indonesia","إندونيسيا","Indonésie"],
    ie:["Ireland","أيرلندا","Irlande"],
    il:["Israel","إسرائيل","Israël"],
    in:["India","الهند","Inde"],
    iq:["Iraq","العراق","Irak"],
    ir:["Iran","إيران","Iran"],
    it:["Italy","إيطاليا","Italie"],
    jp:["Japan","اليابان","Japon"],
    jo:["Jordan","الأردن","Jordanie"],
    ke:["Kenya","كينيا","Kenya"],
    kr:["South Korea","كوريا الجنوبية","Corée du Sud"],
    kw:["Kuwait","الكويت","Koweït"],
    lb:["Lebanon","لبنان","Liban"],
    ly:["Libya","ليبيا","Libye"],
    ma:["Morocco","المغرب","Maroc"],
    mx:["Mexico","المكسيك","Mexique"],
    my:["Malaysia","ماليزيا","Malaisie"],
    ng:["Nigeria","نيجيريا","Nigéria"],
    nl:["Netherlands","هولندا","Pays-Bas"],
    no:["Norway","النرويج","Norvège"],
    nz:["New Zealand","نيوزيلندا","Nouvelle-Zélande"],
    om:["Oman","عُمان","Oman"],
    pk:["Pakistan","باكستان","Pakistan"],
    ps:["Palestine","فلسطين","Palestine"],
    pt:["Portugal","البرتغال","Portugal"],
    qa:["Qatar","قطر","Qatar"],
    ru:["Russia","روسيا","Russie"],
    sa:["Saudi Arabia","السعودية","Arabie saoudite"],
    se:["Sweden","السويد","Suède"],
    sg:["Singapore","سنغافورة","Singapour"],
    sy:["Syria","سوريا","Syrie"],
    tn:["Tunisia","تونس","Tunisie"],
    tr:["Turkey","تركيا","Turquie"],
    tw:["Taiwan","تايوان","Taïwan"],
    ua:["Ukraine","أوكرانيا","Ukraine"],
    us:["United States","الولايات المتحدة","États-Unis"],
    ve:["Venezuela","فنزويلا","Venezuela"],
    vn:["Vietnam","فيتنام","Vietnam"],
    ye:["Yemen","اليمن","Yémen"],
    za:["South Africa","جنوب أفريقيا","Afrique du Sud"]
  };

  let channels = [];
  let selectedCountry = null;
  let favorites = new Set();
  let lang = "ar";

  try {
    favorites = new Set(JSON.parse(localStorage.getItem("nova-tv-favorites") || "[]"));
  } catch (_) {}

  function t(key, ...args) {
    const value = text[lang][key];
    return typeof value === "function" ? value(...args) : value;
  }

  function countryCodeFromInfo(info, group) {
    const explicit = info.match(/tvg-country\s*=\s*"([^"]+)"/i);
    if (explicit) {
      const first = explicit[1].split(/[;,]/)[0].trim().toLowerCase();
      if (/^[a-z]{2}$/.test(first)) return first;
    }

    const names = (group || "").toLowerCase().trim();
    for (const [code, namesList] of Object.entries(knownCountries)) {
      if (namesList.some(n => n.toLowerCase() === names)) return code;
    }

    const groupMatch = names.match(/(?:^|[^a-z])([a-z]{2})(?:$|[^a-z])/);
    if (groupMatch && knownCountries[groupMatch[1]]) return groupMatch[1];
    return "";
  }

  function countryDisplay(code, rawName) {
    if (knownCountries[code]) {
      const names = knownCountries[code];
      return lang === "ar" ? names[1] : lang === "fr" ? names[2] : names[0];
    }
    return rawName || (code ? code.toUpperCase() : (lang === "ar" ? "دولة غير محددة" : "Unknown country"));
  }

  function flagFor(code) {
    if (!/^[a-z]{2}$/i.test(code || "")) return "🌐";
    return [...code.toUpperCase()].map(c =>
      String.fromCodePoint(127397 + c.charCodeAt(0))
    ).join("");
  }

  function parseM3U(source) {
    const lines = source.replace(/^\uFEFF/, "").split(/\r?\n/);
    const result = [];
    let info = "";

    for (const line of lines) {
      const value = line.trim();
      if (!value) continue;

      if (value.startsWith("#EXTINF")) {
        info = value;
        continue;
      }

      if (value.startsWith("#") || !/^https?:\/\//i.test(value)) continue;

      const nameMatch = info.match(/,(.*)$/);
      const name = nameMatch ? nameMatch[1].trim() : "Channel";
      const groupMatch = info.match(/group-title\s*=\s*"([^"]*)"/i);
      const logoMatch = info.match(/tvg-logo\s*=\s*"([^"]*)"/i);
      const code = countryCodeFromInfo(info, groupMatch ? groupMatch[1] : "");
      const group = groupMatch ? groupMatch[1].trim() : "";
      const id = result.length + 1;

      result.push({
        id,
        name: name || "Channel",
        url: value,
        code,
        group,
        logo: logoMatch ? logoMatch[1] : ""
      });
      info = "";
    }
    return result;
  }

  function allCountries() {
    const map = new Map();
    for (const channel of channels) {
      const code = channel.code || "unknown";
      if (!map.has(code)) {
        map.set(code, {
          code,
          name: countryDisplay(code, channel.group),
          channels: []
        });
      }
      map.get(code).channels.push(channel);
    }
    return [...map.values()].sort((a,b) =>
      a.name.localeCompare(b.name, lang === "ar" ? "ar" : lang === "fr" ? "fr" : "en")
    );
  }

  function setStatus(message) {
    $("status").textContent = message;
  }

  function renderCountries() {
    $("countrySection").classList.remove("hidden");
    $("channelSection").classList.add("hidden");
    $("countries").replaceChildren();

    const query = $("search").value.trim().toLocaleLowerCase();
    const list = allCountries().filter(country =>
      country.name.toLocaleLowerCase().includes(query) ||
      country.code.toLocaleLowerCase().includes(query) ||
      country.channels.some(c => c.name.toLocaleLowerCase().includes(query))
    );

    $("countryHeading").textContent = t("countries");
    $("countryCount").textContent = t("countCountries", list.length);

    if (!list.length) {
      $("countries").textContent = t("emptyCountries");
      return;
    }

    const fragment = document.createDocumentFragment();

    for (const country of list) {
      const button = document.createElement("button");
      button.className = "country";
      button.type = "button";

      const flag = document.createElement("span");
      flag.className = "flag";
      flag.textContent = flagFor(country.code);

      const info = document.createElement("span");
      info.className = "country-info";

      const name = document.createElement("span");
      name.className = "country-name";
      name.textContent = country.name;

      const count = document.createElement("span");
      count.className = "country-count";
      count.textContent = t("countChannels", country.channels.length);

      const arrow = document.createElement("span");
      arrow.className = "arrow";
      arrow.textContent = "←";

      info.append(name, count);
      button.append(flag, info, arrow);
      button.addEventListener("click", () => {
        selectedCountry = country.code;
        $("search").value = "";
        renderChannels();
      });
      fragment.append(button);
    }

    $("countries").append(fragment);
  }

  function renderChannels() {
    $("countrySection").classList.add("hidden");
    $("channelSection").classList.remove("hidden");
    $("channels").replaceChildren();

    const country = allCountries().find(c => c.code === selectedCountry);
    if (!country) {
      renderCountries();
      return;
    }

    $("back").textContent = t("back");
    $("channelHeading").textContent =
      `${flagFor(country.code)} ${country.name}`;
    const query = $("search").value.trim().toLocaleLowerCase();

    const list = country.channels.filter(c =>
      c.name.toLocaleLowerCase().includes(query)
    );

    $("channelCount").textContent = t("countChannels", list.length);

    if (!list.length) {
      $("channels").textContent = t("emptyChannels");
      return;
    }

    const fragment = document.createDocumentFragment();

    for (const channel of list) {
      const card = document.createElement("article");
      card.className = "channel";

      const top = document.createElement("div");
      top.className = "channel-top";

      if (channel.logo && /^https?:\/\//i.test(channel.logo)) {
        const logo = document.createElement("img");
        logo.className = "logo";
        logo.alt = "";
        logo.loading = "lazy";
        logo.referrerPolicy = "no-referrer";
        logo.src = channel.logo;
        logo.onerror = () => logo.remove();
        top.append(logo);
      } else {
        const flag = document.createElement("span");
        flag.className = "flag";
        flag.textContent = flagFor(country.code);
        top.append(flag);
      }

      const info = document.createElement("div");
      info.className = "channel-info";

      const name = document.createElement("div");
      name.className = "channel-name";
      name.textContent = channel.name;

      const sub = document.createElement("div");
      sub.className = "channel-country";
      sub.textContent = country.name;

      info.append(name, sub);
      top.append(info);

      const actions = document.createElement("div");
      actions.className = "channel-actions";

      const play = document.createElement("button");
      play.className = "primary";
      play.textContent = t("watch");
      play.addEventListener("click", () => playChannel(channel));

      const fav = document.createElement("button");
      fav.textContent = favorites.has(channel.url) ? t("unfavorite") : t("favorite");
      fav.addEventListener("click", () => {
        if (favorites.has(channel.url)) favorites.delete(channel.url);
        else favorites.add(channel.url);

        try {
          localStorage.setItem("nova-tv-favorites", JSON.stringify([...favorites]));
        } catch (_) {}
        fav.textContent = favorites.has(channel.url) ? t("unfavorite") : t("favorite");
      });

      actions.append(play, fav);
      card.append(top, actions);
      fragment.append(card);
    }

    $("channels").append(fragment);
  }

  function playChannel(channel) {
    const player = $("player");
    player.classList.remove("hidden");
    player.pause();
    player.src = channel.url;
    player.load();
    player.play().catch(() => {
      setStatus(t("playing"));
    });
    player.scrollIntoView({behavior:"smooth", block:"start"});
    setStatus(`${channel.name} — ${t("playing")}`);
  }

  async function loadPlaylist() {
    $("reload").disabled = true;
    setStatus(t("loading"));

    try {
      const response = await fetch(PLAYLIST_URL + "?v=" + Date.now(), {
        cache:"no-store"
      });
      if (!response.ok) throw new Error("HTTP " + response.status);

      const source = await response.text();
      const parsed = parseM3U(source);
      if (!parsed.length) throw new Error("No channels found");

      channels = parsed;
      selectedCountry = null;
      $("player").pause();
      $("player").removeAttribute("src");
      $("player").classList.add("hidden");

      renderCountries();
      setStatus(t("ready", channels.length));
    } catch (error) {
      console.error(error);
      setStatus(t("error") + " (" + error.message + ")");
    } finally {
      $("reload").disabled = false;
    }
  }

  function applyLanguage() {
    lang = $("language").value;
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    $("subtitle").textContent = t("subtitle");
    $("search").placeholder = t("search");
    $("reload").textContent = t("load");
    $("countryHeading").textContent = t("countries");

    if (selectedCountry !== null) renderChannels();
    else renderCountries();
  }

  $("language").addEventListener("change", applyLanguage);
  $("reload").addEventListener("click", loadPlaylist);
  $("back").addEventListener("click", () => {
    selectedCountry = null;
    $("search").value = "";
    renderCountries();
  });
  $("search").addEventListener("input", () => {
    if (selectedCountry !== null) renderChannels();
    else renderCountries();
  });

  applyLanguage();
  loadPlaylist();
})();
</script>
</body>
</html>
