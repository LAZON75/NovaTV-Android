<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVibe PRO - NextGen IPTV Experience</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- HLS Streaming Library -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        :root {
            --bg-main: #06080e;
            --bg-card: rgba(18, 24, 38, 0.85);
            --bg-glass: rgba(255, 255, 255, 0.05);
            --primary-blue: #00d2ff;
            --primary-glow: rgba(0, 210, 255, 0.5);
            --btn-settings: #c01248;
            --pill-active: #ffffff;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --border-subtle: rgba(255, 255, 255, 0.12);
        }

        [data-theme="neon"] {
            --primary-blue: #ff007f;
            --primary-glow: rgba(255, 0, 127, 0.5);
            --btn-settings: #d60060;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Tajawal', sans-serif;
            user-select: none;
            outline: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 40px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 210, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 0, 85, 0.06) 0%, transparent 40%);
        }

        /* Top Navigation Header */
        .top-navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 40px;
            background: rgba(6, 8, 14, 0.95);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-subtle);
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
        }

        .brand-logo-3d {
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5, #ff0055);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 210, 255, 0.6);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-badge {
            background: linear-gradient(135deg, #ff0055, #ff5050);
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
        }

        .server-status-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            color: #10b981;
        }

        .green-dot {
            width: 9px; height: 9px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981;
            animation: pulse-green 1.5s infinite;
        }

        @keyframes pulse-green {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .nav-center {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-glass);
            padding: 5px;
            border-radius: 30px;
            border: 1px solid var(--border-subtle);
        }

        .nav-pill {
            background: transparent;
            border: none;
            color: var(--text-sub);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-pill.active, .nav-pill:hover {
            background: var(--pill-active);
            color: #0f172a;
            font-weight: 700;
        }

        .icon-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: #fff;
            width: 42px; height: 42px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; cursor: pointer;
            transition: 0.2s;
        }

        .icon-btn:hover {
            background: var(--primary-blue);
            color: #000;
        }

        /* Views */
        .view-section {
            display: none;
            padding: 25px 40px;
        }

        .view-section.active { display: block; }

        /* Large Cinema Banner */
        .hero-banner-large {
            position: relative;
            width: 100%;
            min-height: 260px;
            border-radius: 24px;
            overflow: hidden;
            background: linear-gradient(180deg, rgba(6, 8, 14, 0.3) 0%, rgba(6, 8, 14, 0.95) 100%),
                        url('https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?q=80&w=1400&auto=format&fit=crop') center/cover no-repeat;
            border: 1px solid var(--border-subtle);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            margin-bottom: 35px;
        }

        .hero-banner-title {
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #ffffff, #00d2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-banner-sub {
            color: var(--text-sub);
            font-size: 15px;
            max-width: 600px;
        }

        /* Expanded Category Grid */
        .quick-categories-grid-large {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 22px;
            margin-bottom: 30px;
        }

        .category-card-large {
            height: 220px;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            border: 1px solid var(--border-subtle);
            background: #121824;
            transition: all 0.3s ease;
        }

        .category-card-large:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--primary-blue);
            box-shadow: 0 15px 35px var(--primary-glow);
        }

        .category-card-large img {
            width: 100%; height: 100%;
            object-fit: cover;
            filter: brightness(0.65);
        }

        .category-card-overlay-large {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            padding: 20px;
            background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.95) 100%);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .category-card-overlay-large i { font-size: 26px; }
        .category-card-overlay-large span { font-size: 20px; font-weight: 800; }

        /* Media Grids */
        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .media-card {
            background: var(--bg-card);
            border-radius: 14px; overflow: hidden;
            border: 1px solid var(--border-subtle);
            cursor: pointer; transition: 0.2s;
        }

        .media-card:hover { transform: translateY(-5px); border-color: var(--primary-blue); }
        .media-card img { width: 100%; height: 230px; object-fit: cover; }
        .media-card-body { padding: 12px; }

        /* Live TV Layout */
        .live-layout {
            display: grid;
            grid-template-columns: 460px 1fr;
            gap: 30px;
        }

        .player-preview-card {
            background: var(--bg-card);
            border-radius: 20px; overflow: hidden;
            border: 1px solid var(--border-subtle);
            position: sticky; top: 100px;
        }

        .video-box { width: 100%; height: 260px; background: #000; }
        .video-box video { width: 100%; height: 100%; object-fit: cover; }

        .channels-pro-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .channel-pro-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 14px; padding: 15px;
            display: flex; align-items: center; gap: 12px;
            cursor: pointer; transition: 0.2s;
        }
        .channel-pro-card:hover { border-color: var(--primary-blue); background: rgba(0,210,255,0.1); }

        /* Settings Modal & Sub-Modals Structure */
        .settings-modal {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            z-index: 10000;
            display: none;
            align-items: center; justify-content: center;
        }

        .settings-modal.active { display: flex !important; }

        .settings-content {
            background: #0f131f;
            border: 1px solid var(--border-subtle);
            border-radius: 24px;
            padding: 30px;
            width: 90%; max-width: 480px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9);
            position: relative;
        }

        .settings-title-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .settings-title-bar h2 { font-size: 22px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 10px; }

        .close-settings {
            background: transparent; border: none;
            color: var(--text-sub); font-size: 22px;
            cursor: pointer;
        }

        .settings-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .settings-btn {
            background: var(--btn-settings);
            color: #fff; border: none;
            padding: 15px 20px; border-radius: 16px;
            font-size: 15px; font-weight: 700;
            display: flex; align-items: center; justify-content: space-between;
            cursor: pointer; transition: 0.2s;
            box-shadow: 0 4px 15px rgba(192, 18, 72, 0.25);
            text-align: left; width: 100%;
        }

        .settings-btn:hover { opacity: 0.92; transform: scale(1.02); }
        .settings-btn-left { display: flex; align-items: center; gap: 15px; }
        .settings-btn i { font-size: 18px; width: 24px; text-align: center; }

        /* Sub Settings Forms */
        .sub-setting-view {
            display: none;
            flex-direction: column;
            gap: 15px;
        }

        .sub-setting-view.active { display: flex; }

        .form-group {
            display: flex; flex-direction: column; gap: 8px;
        }

        .form-group label {
            font-size: 13px; font-weight: 700; color: var(--text-sub);
        }

        .form-input, .form-select {
            width: 100%;
            background: #182032;
            border: 1px solid var(--border-subtle);
            color: #fff;
            padding: 12px 15px;
            border-radius: 12px;
            font-size: 14px;
        }

        .btn-submit {
            background: var(--primary-blue);
            color: #000; border: none;
            padding: 14px; border-radius: 12px;
            font-weight: 800; font-size: 14px;
            cursor: pointer; margin-top: 10px;
        }

        .btn-back-settings {
            background: rgba(255, 255, 255, 0.08);
            color: #fff; border: none;
            padding: 8px 14px; border-radius: 10px;
            font-size: 13px; font-weight: 700;
            cursor: pointer; display: flex; align-items: center; gap: 6px;
        }

        @media (max-width: 900px) {
            .top-navbar { padding: 15px 20px; flex-direction: column; gap: 15px; }
            .live
