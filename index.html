<!DOCTYPE html>
<html lang="fr" dir="ltr" id="appHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVibe PRO - NextGen IPTV Experience</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- HLS & Three.js Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --bg-main: #07090e;
            --bg-card: #121824;
            --bg-glass: rgba(18, 24, 36, 0.85);
            --primary-accent: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.35);
            --btn-settings: #f43f5e;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-subtle: rgba(255, 255, 255, 0.08);
        }

        [data-theme="neon"] {
            --primary-accent: #ec4899;
            --primary-glow: rgba(236, 72, 153, 0.35);
            --btn-settings: #d946ef;
        }

        [data-theme="cyber"] {
            --primary-accent: #2dd4bf;
            --primary-glow: rgba(45, 212, 191, 0.35);
            --btn-settings: #0284c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', 'Tajawal', sans-serif;
            user-select: none;
            outline: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 50px;
        }

        #webgl-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        /* شريط التنقل العلوي الأنيق */
        .top-navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 45px;
            background: rgba(7, 9, 14, 0.92);
            backdrop-filter: blur(25px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-subtle);
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
        }

        .brand-logo-3d {
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary-accent), #818cf8, #f43f5e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-badge {
            background: linear-gradient(135deg, #f43f5e, #fb7185);
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            -webkit-text-fill-color: #fff;
        }

        .server-status-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            color: #34d399;
        }

        .green-dot {
            width: 8px; height: 8px;
            background-color: #34d399;
            border-radius: 50%;
            box-shadow: 0 0 10px #34d399;
            animation: pulse-green 1.5s infinite;
        }

        @keyframes pulse-green {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(52, 211, 153, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
        }

        .nav-center {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.03);
            padding: 6px;
            border-radius: 30px;
            border: 1px solid var(--border-subtle);
        }

        .nav-pill {
            background: transparent;
            border: none;
            color: var(--text-sub);
            padding: 8px 22px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-pill.active, .nav-pill:hover {
            background: var(--primary-accent);
            color: #07090e;
            font-weight: 800;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .icon-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: #fff;
            width: 44px; height: 44px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; cursor: pointer;
            transition: 0.2s;
        }

        .icon-btn:hover {
            background: var(--primary-accent);
            color: #07090e;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        /* عرض الأقسام */
        .view-section {
            display: none;
            padding: 35px 45px;
        }

        .view-section.active { display: block; }

        /* بانر السينما الكامل تحت القوائم */
        .hero-banner-large {
            position: relative;
            width: 100%;
            min-height: 380px;
            border-radius: 28px;
            overflow: hidden;
            background: linear-gradient(180deg, rgba(7, 9, 14, 0.1) 0%, rgba(7, 9, 14, 0.96) 100%),
                        url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=1400&auto=format&fit=crop') center/cover no-repeat;
            border: 1px solid var(--border-subtle);
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            margin-bottom: 35px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
        }

        .hero-banner-title {
            font-size: 42px;
            font-weight: 900;
            margin-bottom: 12px;
            background: linear-gradient(90deg, #ffffff, var(--primary-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-banner-sub {
            color: var(--text-sub);
            font-size: 16px;
            max-width: 750px;
            line-height: 1.6;
        }

        /* شبكة الأقسام الأربعة ظاهرة بالكامل وأنيقة */
        .quick-categories-grid-large {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 22px;
            margin-bottom: 35px;
        }

        .category-card-large {
            height: 220px;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            border: 1px solid var(--border-subtle);
            background: var(--bg-card);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .category-card-large:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--primary-accent);
            box-shadow: 0 20px 40px var(--primary-glow);
        }

        .category-card-large img {
            width: 100%; height: 100%;
            object-fit: cover;
            filter: brightness(0.6);
            transition: 0.35s;
        }

        .category-card-large:hover img { filter: brightness(0.85); }

        .category-card-overlay-large {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            padding: 22px;
            background: linear-gradient(180deg, transparent 0%, rgba(7,9,14,0.95) 100%);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .category-card-overlay-large i { font-size: 24px; color: var(--primary-accent); }
        .category-card-overlay-large span { font-size: 18px; font-weight: 800; color: #fff; }

        /* شبكة الوسائط والأفلام */
        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 22px;
        }

        .media-card {
            background: var(--bg-card);
            border-radius: 16px; overflow: hidden;
            border: 1px solid var(--border-subtle);
            cursor: pointer; transition: 0.3s;
        }

        .media-card:hover { transform: translateY(-6px); border-color: var(--primary-accent); box-shadow: 0 15px 30px var(--primary-glow); }
        .media-card img { width: 100%; height: 240px; object-fit: cover; }
        .media-card-body { padding: 16px; }

        /* شاشة البث الحي وجدول القنوات */
        .live-layout {
            display: grid;
            grid-template-columns: 440px 1fr;
            gap: 28px;
            align-items: start;
        }

        .player-preview-card {
            background: var(--bg-card);
            border-radius: 22px; 
            overflow: hidden;
            border: 1px solid var(--border-subtle);
            position: sticky; 
            top: 100px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.85);
        }

        .video-box { 
            width: 100%; 
            height: 260px; 
            background: #000; 
            position: relative; 
        }
        
        .video-box video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }

        .filter-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            background: var(--bg-card);
            padding: 16px 24px;
            border-radius: 18px;
            border: 1px solid var(--border-subtle);
        }

        .filter-bar select {
            background: #07090e;
            color: #fff;
            border: 1px solid var(--border-subtle);
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .channels-pro-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            max-height: 72vh;
            overflow-y: auto;
            padding-right: 6px;
        }

        .channels-pro-grid::-webkit-scrollbar { width: 6px; }
        .channels-pro-grid::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); border-radius: 10px; }
        .channels-pro-grid::-webkit-scrollbar-thumb { background: var(--primary-accent); border-radius: 10px; }

        .channel-pro-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 18px; 
            padding: 15px 18px;
            display: flex; 
            align-items: center; 
            gap: 15px;
            cursor: pointer; 
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .channel-pro-card:hover { 
            border-color: var(--primary-accent); 
            background: rgba(18, 24, 36, 0.95);
            transform: translateY(-3px);
            box-shadow: 0 12px 30px var(--primary-glow);
        }

        .channel-pro-card.active-channel {
            border-color: var(--primary-accent);
            background: rgba(56, 189, 248, 0.12);
            box-shadow: 0 0 25px var(--primary-glow);
        }

        .channel-icon-badge {
            width: 45px; height: 45px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
            border: 1px solid var(--border-subtle);
        }

        .channel-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
        }

        .channel-name {
            font-size: 14px; 
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .channel-type {
            font-size: 11px;
            color: var(--text-sub);
        }

        /* ⚙️ تصميم نافذة الإعدادات الجديدة المطابقة للصورة تماماً */
        .settings-modal {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.82);
            backdrop-filter: blur(20px);
            z-index: 99999;
            display: none;
            align-items: center; justify-content: center;
            overflow-y: auto;
            padding: 30px 0;
        }

        .settings-modal.active { display: flex !important; }

        .settings-content {
            background: #0b0f19;
            border: 1px solid var(--border-subtle);
            border-radius: 28px;
            padding: 35px;
            width: 90%; max-width: 580px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.95);
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .settings-header-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 15px;
        }

        .settings-header-box h2 {
            font-size: 24px;
            font-weight: 900;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .close-settings-btn {
            background: rgba(255,255,255,0.08);
            border: none; color: #fff;
            width: 38px; height: 38px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s;
        }
        .close-settings-btn:hover { background: var(--btn-settings); }

        /* بطاقات الإعدادات على شكل كروت مشابهة للصورة */
        .setting-card-box {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 22px;
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .setting-card-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 17px;
            font-weight: 800;
            color: #fff;
        }

        .setting-card-title i {
            color: var(--primary-accent);
            font-size: 20px;
        }

        .setting-card-desc {
            font-size: 13px;
            color: var(--text-sub);
            line-height: 1.5;
        }

        .setting-input-box {
            background: #07090e;
            border: 1px solid var(--border-subtle);
            color: #fff;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 14px;
            width: 100%;
        }

        .setting-action-btn {
            background: transparent;
            border: 1px solid var(--primary-accent);
            color: var(--primary-accent);
            padding: 12px 20px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.25s;
            text-align: center;
        }

        .setting-action-btn:hover {
            background: var(--primary-accent);
            color: #07090e;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .setting-action-btn.danger {
            border-color: var(--btn-settings);
            color: var(--btn-settings);
        }
        .setting-action-btn.danger:hover {
            background: var(--btn-settings);
            color: #fff;
            box-shadow: 0 0 15px rgba(244, 63, 94, 0.4);
        }

        @media (max-width: 900px) {
            .live-layout { grid-template-columns: 1fr; }
            .player-preview-card { position: relative; top: 0; }
            .top-navbar { padding: 12px 20px; }
            .quick-categories-grid-large { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <canvas id="webgl-canvas"></canvas>

    <!-- شريط التنقل -->
    <nav class="top-navbar">
        <div class="brand-container" onclick="switchView('homeView', document.querySelector('.nav-pill'))">
            <div class="brand-logo-3d">
                <i class="fa-solid fa-play" style="color:var(--primary-accent);"></i> StreamVibe <span class="brand-badge">PRO</span>
            </div>
            <div class="server-status-pill">
                <span class="green-dot"></span>
                <span data-i18n="serverOnline">SERVER ONLINE</span>
            </div>
        </div>

        <div class="nav-center">
            <button class="nav-pill active" onclick="switchView('homeView', this)" data-i18n="navHome">الرئيسية</button>
            <button class="nav-pill" onclick="switchView('moviesView', this)" data-i18n="navMovies">الأفلام</button>
            <button class="nav-pill" onclick="switchView('seriesView', this)" data-i18n="navSeries">المسلسلات</button>
            <button class="nav-pill" onclick="switchView('animesView', this)" data-i18n="navAnimes">الأنمي</button>
            <button class="nav-pill" onclick="switchView('liveView', this)" data-i18n="navLive">البث الحي</button>
        </div>

        <div class="nav-right">
            <button class="icon-btn" onclick="openSettings()"><i class="fa-solid fa-gear"></i></button>
        </div>
    </nav>

    <!-- HOME VIEW -->
    <div id="homeView" class="view-section active">
        <!-- بانر السينما الكامل والواسع -->
        <div class="hero-banner-large">
            <h1 class="hero-banner-title" data-i18n="heroTitle">StreamVibe PRO - منصة البث الشاملة</h1>
            <p class="hero-banner-sub" data-i18n="heroSub">استمتع بتجربة مشاهدة مذهلة لأفضل الأفلام، المسلسلات، الأنمي ومئات القنوات التلفزيونية الحية بجودة Ultra HD.</p>
        </div>

        <!-- الأقسام الأربعة ظاهرة بالكامل -->
        <div class="quick-categories-grid-large">
            <div class="category-card-large" onclick="switchView('moviesView', document.querySelectorAll('.nav-pill')[1])">
                <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=600&auto=format&fit=crop" alt="Films">
                <div class="category-card-overlay-large">
                    <i class="fa-solid fa-film"></i>
                    <span data-i18n="catMovies">الأفلام</span>
                </div>
            </div>
            <div class="category-card-large" onclick="switchView('seriesView', document.querySelectorAll('.nav-pill')[2])">
                <img src="https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?q=80&w=600&auto=format&fit=crop" alt="Séries">
                <div class="category-card-overlay-large">
                    <i class="fa-solid fa-tv"></i>
                    <span data-i18n="catSeries">المسلسلات</span>
                </div>
            </div>
            <div class="category-card-large" onclick="switchView('liveView', document.querySelectorAll('.nav-pill')[4])">
                <img src="https://images.unsplash.com/photo-1593784991095-a205069470b6?q=80&w=600&auto=format&fit=crop" alt="Live">
                <div class="category-card-overlay-large">
                    <i class="fa-solid fa-satellite-dish"></i>
                    <span data-i18n="catLive">البث الحي</span>
                </div>
            </div>
            <div class="category-card-large" onclick="switchView('animesView', document.querySelectorAll('.nav-pill')[3])">
                <img src="https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=600&auto=format&fit=crop" alt="Animés">
                <div class="category-card-overlay-large">
                    <i class="fa-solid fa-child"></i>
                    <span data-i18n="catAnimes">الأنمي</span>
                </div>
            </div>
        </div>
    </div>

    <!-- FILMS VIEW -->
    <div id="moviesView" class="view-section">
        <h2 style="margin-bottom:20px; font-weight:800;"><i class="fa-solid fa-film" style="color:var(--primary-accent);"></i> <span data-i18n="libMovies">مكتبة الأفلام</span></h2>
        <div class="media-grid" id="moviesGrid"></div>
    </div>

    <!-- SÉRIES VIEW -->
    <div id="seriesView" class="view-section">
        <h2 style="margin-bottom:20px; font-weight:800;"><i class="fa-solid fa-tv" style="color:var(--primary-accent);"></i> <span data-i18n="libSeries">المسلسلات والمواسم</span></h2>
        <div class="media-grid" id="seriesGrid"></div>
    </div>

    <!-- ANIMÉS VIEW -->
    <div id="animesView" class="view-section">
        <h2 style="margin-bottom:20px; font
