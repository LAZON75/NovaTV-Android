<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVibe PRO - NextGen IPTV Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --bg-main: #06080e;
            --bg-card: rgba(18, 24, 38, 0.85);
            --bg-glass: rgba(255, 255, 255, 0.05);
            --primary-blue: #00d2ff;
            --primary-glow: rgba(0, 210, 255, 0.5);
            --btn-settings: #c01248;
            --pill-active: #ffffff;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --border-subtle: rgba(255, 255, 255, 0.1);
        }

        [data-theme="neon"] {
            --primary-blue: #ff007f;
            --primary-glow: rgba(255, 0, 127, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Tajawal', sans-serif;
            user-select: none;
            outline: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 40px;
        }

        #webgl-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        /* Top Bar Navigation */
        .top-navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 40px;
            background: rgba(6, 8, 14, 0.9);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-subtle);
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
        }

        .brand-logo-3d {
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5, #ff0055);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 210, 255, 0.6);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-badge {
            background: linear-gradient(135deg, #ff0055, #ff5050);
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
        }

        .server-status-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            color: #10b981;
        }

        .green-dot {
            width: 9px; height: 9px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981;
            animation: pulse-green 1.5s infinite;
        }

        @keyframes pulse-green {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .nav-center {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-glass);
            padding: 5px;
            border-radius: 30px;
            border: 1px solid var(--border-subtle);
        }

        .nav-pill {
            background: transparent;
            border: none;
            color: var(--text-sub);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-pill.active, .nav-pill:hover {
            background: var(--pill-active);
            color: #0f172a;
            font-weight: 700;
        }

        .icon-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: #fff;
            width: 42px; height: 42px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; cursor: pointer;
            transition: 0.2s;
        }

        .icon-btn:hover {
            background: var(--primary-blue);
            color: #000;
        }

        /* Views */
        .view-section {
            display: none;
            padding: 25px 40px;
            animation: fadeIn 0.3s ease-in-out;
        }

        .view-section.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Home View */
        .hero-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 30px;
            margin-bottom: 30px;
            align-items: center;
        }

        .poster-card {
            width: 100%; border-radius: 20px;
            overflow: hidden; height: 440px;
            border: 1px solid var(--border-subtle);
        }

        .poster-card img { width: 100%; height: 100%; object-fit: cover; }

        .quick-categories-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .category-card {
            height: 160px; border-radius: 16px;
            overflow: hidden; position: relative;
            cursor: pointer; border: 1px solid var(--border-subtle);
            background: #1e293b; transition: 0.25s;
        }

        .category-card:hover { transform: translateY(-5px); border-color: var(--primary-blue); }
        .category-card img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.65); }

        .category-card-overlay {
            position: absolute; bottom: 0; left: 0; width: 100%;
            padding: 15px; background: linear-gradient(180deg, transparent, rgba(0,0,0,0.9));
            display: flex; align-items: center; gap: 10px;
        }

        /* Media Grids for Films, Series, Animes */
        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .media-card {
            background: var(--bg-card);
            border-radius: 14px; overflow: hidden;
            border: 1px solid var(--border-subtle);
            cursor: pointer; transition: 0.2s;
        }

        .media-card:hover { transform: translateY(-5px); border-color: var(--primary-blue); }
        .media-card img { width: 100%; height: 230px; object-fit: cover; }
        .media-card-body { padding: 12px; }

        /* Live TV */
        .live-layout {
            display: grid;
            grid-template-columns: 460px 1fr;
            gap: 30px;
        }

        .player-preview-card {
            background: var(--bg-card);
            border-radius: 20px; overflow: hidden;
            border: 1px solid var(--border-subtle);
            position: sticky; top: 100px;
        }

        .video-box { width: 100%; height: 260px; background: #000; }
        .video-box video { width: 100%; height: 100%; object-fit: cover; }

        .channels-pro-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .channel-pro-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 14px; padding: 15px;
            display: flex; align-items: center; gap: 12px;
            cursor: pointer; transition: 0.2s;
        }
        .channel-pro-card:hover { border-color: var(--primary-blue); background: rgba(0,210,255,0.1); }

        /* Settings Modal (Paramètres) */
        .settings-modal {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            z-index: 10000;
            display: none;
            align-items: center; justify-content: center;
        }

        .settings-modal.active { display: flex !important; }

        .settings-content {
            background: #0f131f;
            border: 1px solid var(--border-subtle);
            border-radius: 24px;
            padding: 30px;
            width: 90%; max-width: 480px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9);
            position: relative;
        }

        .settings-title-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .settings-title-bar h2 {
            font-size: 24px;
            font-weight: 800;
            color: #fff;
        }

        .close-settings {
            background: transparent; border: none;
            color: var(--text-sub); font-size: 20px;
            cursor: pointer;
        }

        .settings-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .settings-btn {
            background: var(--btn-settings);
            color: #fff; border: none;
            padding: 15px 20px; border-radius: 16px;
            font-size: 15px; font-weight: 700;
            display: flex; align-items: center; gap: 15px;
            cursor: pointer; transition: 0.2s;
            box-shadow: 0 4px 15px rgba(192, 18, 72, 0.3);
            text-align: left; width: 100%;
        }

        .settings-btn:hover { opacity: 0.9; transform: scale(1.02); }
        .settings-btn i { font-size: 18px; width: 24px; text-align: center; }

        @media (max-width: 900px) {
            .top-navbar { padding: 15px 20px; flex-direction: column; gap: 15px; }
            .hero-layout, .live-layout { grid-template-columns: 1fr; }
            .quick-categories-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <canvas id="webgl-canvas"></canvas>

    <!-- Top Navigation Header -->
    <nav class="top-navbar">
        <div class="brand-container" onclick="switchView('homeView')">
            <div class="brand-logo-3d">
                <i class="fa-solid fa-play" style="color:#00d2ff;"></i> StreamVibe <span class="brand-badge">PRO</span>
            </div>
            <div class="server-status-pill">
                <span class="green-dot"></span>
                <span>SERVER ONLINE</span>
            </div>
        </div>

        <div class="nav-center">
            <button class="nav-pill active" onclick="switchView('homeView')">page d'accueil</button>
            <button class="nav-pill" onclick="switchView('moviesView')">Films</button>
            <button class="nav-pill" onclick="switchView('seriesView')">Séries TV</button>
            <button class="nav-pill" onclick="switchView('animesView')">Animés</button>
            <button class="nav-pill" onclick="switchView('liveView')">TV en direct</button>
        </div>

        <div class="nav-right">
            <button class="icon-btn" onclick="openSettings()"><i class="fa-solid fa-gear"></i></button>
        </div>
    </nav>

    <!-- HOME VIEW -->
    <div id="homeView" class="view-section active">
        <div class="hero-layout">
            <div class="poster-card">
                <img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=600&auto=format&fit=crop" alt="Hero">
            </div>

            <div style="display:flex; flex-direction:column; gap:15px;">
                <h1 style="font-size:34px; font-weight:800;">StreamVibe PRO - Universal Streaming</h1>
                <p style="color:var(--text-sub); font-size:14px;">Parcourez les films, séries, animés et chaînes en direct avec lecteur intelligent.</p>

                <div class="quick-categories-grid">
                    <div class="category-card" onclick="switchView('moviesView')">
                        <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=400&auto=format&fit=crop" alt="Films">
                        <div class="category-card-overlay">
                            <i class="fa-solid fa-film" style="color:#ff4b60;"></i>
                            <span>Films</span>
                        </div>
                    </div>
                    <div class="category-card" onclick="switchView('seriesView')">
                        <img src="https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?q=80&w=400&auto=format&fit=crop" alt="Séries">
                        <div class="category-card-overlay">
                            <i class="fa-solid fa-tv" style="color:#6c5ce7;"></i>
                            <span>Séries TV</span>
                        </div>
                    </div>
                    <div class="category-card" onclick="switchView('liveView')">
                        <img src="https://images.unsplash.com/photo-1593784991095-a205069470b6?q=80&w=400&auto=format&fit=crop" alt="Live">
                        <div class="category-card-overlay">
                            <i class="fa-solid fa-satellite-dish" style="color:#00c6ff;"></i>
                            <span>TV en direct</span>
                        </div>
                    </div>
                    <div class="category-card" onclick="switchView('animesView')">
                        <img src="https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=400&auto=format&fit=crop" alt="Animés">
                        <div class="category-card-overlay">
                            <i class="fa-solid fa-child" style="color:#00b894;"></i>
                            <span>Animés</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- FILMS VIEW -->
    <div id="moviesView" class="view-section">
        <h2 style="margin-bottom:20px; font-weight:800;"><i class="fa-solid fa-film" style="color:#ff4b60;"></i> Bibliothèque de Films</h2>
        <div class="media-grid" id="moviesGrid"></div>
    </div>

    <!-- SÉRIES VIEW -->
    <div id="seriesView" class="view-section">
        <h2 style="margin-bottom:20px; font-weight:800;"><i class="fa-solid fa-tv" style="color:#6c5ce7;"></i> Séries & Saisons</h2>
        <div class="media-grid" id="seriesGrid"></div>
    </div>

    <!-- ANIMÉS VIEW -->
    <div id="animesView" class="view-section">
        <h2 style="margin-bottom:20px; font-weight:800;"><i class="fa-solid fa-child" style="color:#00b894;"></i> Animés & Enfants</h2>
        <div class="media-grid" id="animesGrid"></div>
    </div>

    <!-- LIVE TV VIEW -->
    <div id="liveView" class="view-section">
        <div class="live-layout">
            <div class="player-preview-card">
                <div class="video-box">
                    <video id="livePlayer" controls autoplay></video>
                </div>
                <div style="padding: 20px;">
                    <h2 id="currentChannelName" style="font-size:20px; font-weight:800;">قناة القرآن الكريم</h2>
                    <p style="color:var(--text-sub); font-size:13px; margin-top:4px;">البث المباشر HD</p>
                </div>
            </div>
            <div class="channels-pro-grid" id="channelsContainer"></div>
        </div>
    </div>

    <!-- SETTINGS MODAL (PARAMÈTRES) -->
    <div class="settings-modal" id="settingsModal">
        <div class="settings-content">
            <div class="settings-title-bar">
                <h2>Paramètres</h2>
                <button class="close-settings" onclick="closeSettings()"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="settings-list">
                <button class="settings-btn" onclick="alert('Ajouter une liste M3U')">
                    <i class="fa-solid fa-link"></i> Ajouter une liste M3U
                </button>
                <button class="settings-btn" onclick="alert('Contrôle parental activé')">
                    <i class="fa-solid fa-lock"></i> Contrôle parental
                </button>
                <button class="settings-btn" onclick="alert('Changer la langue')">
                    <i class="fa-solid fa-globe"></i> Langue
                </button>
                <button class="settings-btn" onclick="alert('Sélectionner le thème')">
                    <i class="fa-solid fa-palette"></i> Thème
                </button>
                <button class="settings-btn" onclick="alert('Lecteur externe sélectionné')">
                    <i class="fa-solid fa-circle-play"></i> Lecteur externe
                </button>
                <button class="settings-btn" onclick="alert('Historique effacé')">
                    <i class="fa-solid fa-trash-can"></i> Effacer l'historique
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Engine -->
    <script>
        const moviesData = [
            { title: "Inception 4K", year: "2010", img: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=400&auto=format&fit=crop" },
            { title: "Interstellar", year: "2014", img: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=400&auto=format&fit=crop" }
        ];

        const seriesData = [
            { title: "Peaky Blinders", year: "Saison 6", img: "https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?q=80&w=400&auto=format&fit=crop" },
            { title: "Breaking Bad", year: "Saison 5", img: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=400&auto=format&fit=crop" }
        ];

        const channelsData = [
            { name: "قناة القرآن الكريم", flag: "🇸🇦", url: "https://vs-hls-push-ww-live.cf.cdntv.africa/makkah/hq/index.m3u8" },
            { name: "قناة السنة النبوية", flag: "🇸🇦", url: "https://vs-hls-push-ww-live.cf.cdntv.africa/madinah/hq/index.m3u8" },
            { name: "France 24 Arabe", flag: "🇫🇷", url: "https://f24hls-i.akamaihd.net/hls/live/221193/F24_AR_HLS/master.m3u8" },
            { name: "Al Jazeera English", flag: "🇶🇦", url: "https://live-hls-web-aje.getaj.net/AJE/03.m3u8" }
        ];

        document.addEventListener("DOMContentLoaded", () => {
            init3DBackground();
            renderGrid('moviesGrid', moviesData);
            renderGrid('seriesGrid', seriesData);
            renderGrid('animesGrid', moviesData);
            renderChannels(channelsData);
            playLive(channelsData[0].url, channelsData[0].name);
        });

        function init3DBackground() {
            const canvas = document.getElementById('webgl-canvas');
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);

            const particlesGeometry = new THREE.BufferGeometry();
            const count = 600;
            const positions = new Float32Array(count * 3);

            for(let i = 0; i < count * 3; i++) {
                positions[i] = (Math.random() - 0.5) * 15;
            }

            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const particlesMaterial = new THREE.PointsMaterial({ size: 0.03, color: 0x00d2ff });
            const particleSystem = new THREE.Points(particlesGeometry, particlesMaterial);
            scene.add(particleSystem);

            camera.position.z = 3;

            function animate() {
                requestAnimationFrame(animate);
                particleSystem.rotation.y += 0.0008;
                renderer.render(scene, camera);
            }
            animate();
        }

        function renderGrid(elementId, data) {
            const grid = document.getElementById(elementId);
            grid.innerHTML = '';
            data.forEach(item => {
                grid.innerHTML += `
                    <div class="media-card" onclick="alert('Lancement de ${item.title}')">
                        <img src="${item.img}" alt="${item.title}">
                        <div class="media-card-body">
                            <div style="font-weight:700; font-size:14px;">${item.title}</div>
                            <div style="color:var(--text-sub); font-size:12px; margin-top:2px;">${item.year}</div>
                        </div>
                    </div>
                `;
            });
        }

        function renderChannels(data) {
            const container = document.getElementById('channelsContainer');
            container.innerHTML = '';
            data.forEach(ch => {
                container.innerHTML += `
                    <div class="channel-pro-card" onclick="playLive('${ch.url}', '${ch.name}')">
                        <div style="font-size:22px;">${ch.flag}</div>
                        <div style="font-size:14px; font-weight:700;">${ch.name}</div>
                    </div>
                `;
            });
        }

        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-pill').forEach(b => b.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        let hls = null;
        function playLive(url, name) {
            const video = document.getElementById('livePlayer');
            document.getElementById('currentChannelName').innerText = name;

            if (Hls.isSupported()) {
                if (hls) hls.destroy();
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.play();
            }
        }

        function openSettings() { document.getElementById('settingsModal').classList.add('active'); }
        function closeSettings() { document.getElementById('settingsModal').classList.remove('active'); }
    </script>
</body>
</html>
