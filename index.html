<!DOCTYPE html>
<html lang="fr" dir="ltr" id="appHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVibe PRO - NextGen IPTV Experience</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- HLS & Three.js Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --bg-main: #05070b;
            --bg-card: #0f1624;
            --primary-blue: #00d2ff;
            --primary-glow: rgba(0, 210, 255, 0.4);
            --btn-settings: #e50914;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --border-subtle: rgba(255, 255, 255, 0.1);
        }

        [data-theme="neon"] {
            --primary-blue: #ff007f;
            --primary-glow: rgba(255, 0, 127, 0.4);
            --btn-settings: #d60060;
        }

        [data-theme="cyber"] {
            --primary-blue: #00ffcc;
            --primary-glow: rgba(0, 255, 204, 0.4);
            --btn-settings: #0088cc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Tajawal', sans-serif;
            user-select: none;
            outline: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 50px;
        }

        #webgl-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        /* شريط التنقل العلوي */
        .top-navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 40px;
            background: rgba(5, 7, 11, 0.9);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-subtle);
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
        }

        .brand-logo-3d {
            font-size: 26px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary-blue), #3a7bd5, #ff0055);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-badge {
            background: linear-gradient(135deg, #ff0055, #ff5050);
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            -webkit-text-fill-color: #fff;
        }

        .server-status-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            color: #10b981;
        }

        .green-dot {
            width: 8px; height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981;
            animation: pulse-green 1.5s infinite;
        }

        @keyframes pulse-green {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .nav-center {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.03);
            padding: 6px;
            border-radius: 30px;
            border: 1px solid var(--border-subtle);
        }

        .nav-pill {
            background: transparent;
            border: none;
            color: var(--text-sub);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-pill.active, .nav-pill:hover {
            background: var(--primary-blue);
            color: #05070b;
            font-weight: 800;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .icon-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: #fff;
            width: 44px; height: 44px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; cursor: pointer;
            transition: 0.2s;
        }

        .icon-btn:hover {
            background: var(--primary-blue);
            color: #05070b;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        /* عرض الأقسام */
        .view-section {
            display: none;
            padding: 30px 40px;
        }

        .view-section.active { display: block; }

        /* بانر السينما الكامل والواسع في الصفحة الرئيسية */
        .hero-banner-large {
            position: relative;
            width: 100%;
            min-height: 380px;
            border-radius: 24px;
            overflow: hidden;
            background: linear-gradient(180deg, rgba(5, 7, 11, 0.2) 0%, rgba(5, 7, 11, 0.95) 100%),
                        url('https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?q=80&w=1400&auto=format&fit=crop') center/cover no-repeat;
            border: 1px solid var(--border-subtle);
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            margin-bottom: 35px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.85);
        }

        .hero-banner-title {
            font-size: 42px;
            font-weight: 900;
            margin-bottom: 12px;
            background: linear-gradient(90deg, #ffffff, var(--primary-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-banner-sub {
            color: var(--text-sub);
            font-size: 16px;
            max-width: 750px;
            line-height: 1.6;
        }

        /* شبكة الأقسام الأربعة ظاهرة بالكامل */
        .quick-categories-grid-large {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .category-card-large {
            height: 220px;
            border-radius: 18px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            border: 1px solid var(--border-subtle);
            background: var(--bg-card);
            transition: all 0.3s ease;
        }

        .category-card-large:hover {
            transform: translateY(-8px);
            border-color: var(--primary-blue);
            box-shadow: 0 15px 30px var(--primary-glow);
        }

        .category-card-large img {
            width: 100%; height: 100%;
            object-fit: cover;
            filter: brightness(0.65);
            transition: 0.3s;
        }

        .category-card-large:hover img { filter: brightness(0.85); }

        .category-card-overlay-large {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            padding: 20px;
            background: linear-gradient(180deg, transparent 0%, rgba(5,7,11,0.95) 100%);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .category-card-overlay-large i { font-size: 24px; color: var(--primary-blue); }
        .category-card-overlay-large span { font-size: 18px; font-weight: 800; color: #fff; }

        /* شبكة الأفلام والمسلسلات */
        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .media-card {
            background: var(--bg-card);
            border-radius: 14px; overflow: hidden;
            border: 1px solid var(--border-subtle);
            cursor: pointer; transition: 0.25s;
        }

        .media-card:hover { transform: translateY(-5px); border-color: var(--primary-blue); box-shadow: 0 10px 25px var(--primary-glow); }
        .media-card img { width: 100%; height: 230px; object-fit: cover; }
        .media-card-body { padding: 14px; }

        /* شاشة البث الحي وجدول القنوات */
        .live-layout {
            display: grid;
            grid-template-columns: 440px 1fr;
            gap: 25px;
            align-items: start;
        }

        .player-preview-card {
            background: var(--bg-card);
            border-radius: 20px; 
            overflow: hidden;
