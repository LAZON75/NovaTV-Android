<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaTV - منصة الترفيه المتقدمة</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HLS.js Library for M3U8 Streaming -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            cyan: '#38bdf8',
                            cyanGlow: '#0284c7',
                            darkBg: '#0f172a',
                            cardBg: 'rgba(30, 41, 59, 0.7)',
                            cardBorder: 'rgba(56, 189, 248, 0.2)'
                        }
                    },
                    fontFamily: {
                        tajawal: ['Tajawal', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overflow-x: hidden;
            user-select: none;
        }

        /* Glassmorphism effects */
        .glass-panel {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(56, 189, 248, 0.15);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Remote control & Focus states */
        :focus, .tv-focus {
            outline: none !important;
            transform: scale(1.05);
            border-color: #38bdf8 !important;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.6), 0 0 5px #38bdf8 !important;
            z-index: 30;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.8);
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #38bdf8;
        }

        /* Hero Glow */
        .hero-glow {
            background: radial-gradient(circle at 20% 40%, rgba(56, 189, 248, 0.15) 0%, transparent 60%);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative antialiased selection:bg-brand-cyan selection:text-black">

    <!-- Toast Notification System -->
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 glass-panel px-6 py-3 rounded-xl shadow-2xl border border-brand-cyan/40 text-brand-cyan text-sm font-bold flex items-center gap-3 transition-all duration-300 opacity-0 pointer-events-none transform -translate-y-4">
        <i class="fa-solid fa-circle-info text-lg"></i>
        <span id="toast-msg">أهلاً بك في NovaTV</span>
    </div>

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 glass-panel border-b border-slate-800/80 px-6 py-4 flex flex-wrap items-center justify-between gap-4">
        <!-- Logo -->
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-600 to-brand-cyan flex items-center justify-center shadow-lg shadow-cyan-500/30">
                <i class="fa-solid fa-play text-slate-950 text-xl"></i>
            </div>
            <span class="text-2xl font-black tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-100 to-brand-cyan">NOVA<span class="text-brand-cyan">TV</span></span>
        </div>

        <!-- Navigation Tabs -->
        <nav class="flex items-center gap-2 overflow-x-auto py-1 max-w-full">
            <button onclick="switchTab('live')" id="tab-live" tabindex="0" class="nav-btn px-5 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 transition-all bg-brand-cyan text-slate-950 shadow-lg shadow-cyan-500/20">
                <i class="fa-solid fa-tv"></i> البث المباشر
            </button>
            <button onclick="switchTab('movies')" id="tab-movies" tabindex="0" class="nav-btn px-5 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 transition-all text-slate-300 hover:text-white hover:bg-slate-800/60">
                <i class="fa-solid fa-film"></i> الأفلام
            </button>
            <button onclick="switchTab('series')" id="tab-series" tabindex="0" class="nav-btn px-5 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 transition-all text-slate-300 hover:text-white hover:bg-slate-800/60">
                <i class="fa-solid fa-clapperboard"></i> المسلسلات
            </button>
            <button onclick="switchTab('favs')" id="tab-favs" tabindex="0" class="nav-btn px-5 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 transition-all text-slate-300 hover:text-white hover:bg-slate-800/60">
                <i class="fa-solid fa-heart"></i> المفضلات
            </button>
            <button onclick="switchTab('settings')" id="tab-settings" tabindex="0" class="nav-btn px-5 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 transition-all text-slate-300 hover:text-white hover:bg-slate-800/60">
                <i class="fa-solid fa-gear"></i> الإعدادات
            </button>
        </nav>

        <!-- Search Bar -->
        <div class="relative min-w-[240px]">
            <i class="fa-solid fa-magnifying-glass absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
            <input type="text" id="searchInput" oninput="handleSearch()" placeholder="بحث عن قنوات، أفلام..." tabindex="0" class="w-full bg-slate-900/80 text-sm text-slate-100 pr-10 pl-4 py-2 rounded-xl border border-slate-700/60 focus:border-brand-cyan focus:ring-1 focus:ring-brand-cyan transition-all">
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 space-y-8">

        <!-- Hero Featured Banner -->
        <section id="heroBanner" class="relative rounded-3xl overflow-hidden glass-panel border border-slate-800 p-6 sm:p-10 min-h-[380px] flex flex-col justify-end hero-glow group">
            <!-- Background Image Blur -->
            <div id="heroBg" class="absolute inset-0 bg-cover bg-center opacity-30 transition-all duration-700 group-hover:scale-105" style="background-image: url('https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=1200');"></div>
            <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/60 to-transparent"></div>

            <div class="relative z-10 space-y-4 max-w-2xl">
                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-brand-cyan/20 border border-brand-cyan/40 text-brand-cyan text-xs font-bold">
                    <span class="w-2 h-2 rounded-full bg-brand-cyan animate-pulse"></span>
                    <span id="heroBadge">بث مباشر مميز</span>
                </div>
                <h1 id="heroTitle" class="text-3xl sm:text-5xl font-black text-white leading-tight">قناة القرآن الكريم المباشرة</h1>
                <p id="heroDesc" class="text-slate-300 text-sm sm:text-base line-clamp-2">بث مباشر على مدار الساعة من الحرم المكي الشريف بأعلى جودة بدقة عالية.</p>
                
                <div class="flex flex-wrap items-center gap-4 pt-2">
                    <button id="heroPlayBtn" onclick="playHeroStream()" tabindex="0" class="px-7 py-3 rounded-xl bg-brand-cyan text-slate-950 font-black text-sm flex items-center gap-3 shadow-lg shadow-cyan-500/30 hover:bg-cyan-300 transition-all">
                        <i class="fa-solid fa-play text-base"></i> شاهد الآن
                    </button>
                    <button id="heroFavBtn" onclick="toggleHeroFav()" tabindex="0" class="px-6 py-3 rounded-xl glass-panel text-white font-bold text-sm flex items-center gap-3 hover:bg-slate-800 transition-all">
                        <i id="heroFavIcon" class="fa-regular fa-heart text-base text-brand-cyan"></i> إضافة للمفضلة
                    </button>
                </div>
            </div>
        </section>

        <!-- Dynamic Sections View -->
        <div id="contentArea" class="space-y-10">
            <!-- Dynamic Category Rows Generated by JS -->
        </div>

        <!-- Settings Modal View (Hidden by default) -->
        <div id="settingsView" class="hidden glass-panel rounded-3xl p-8 max-w-2xl mx-auto border border-slate-800 space-y-6">
            <h2 class="text-2xl font-bold text-white flex items-center gap-3 border-b border-slate-800 pb-4">
                <i class="fa-solid fa-sliders text-brand-cyan"></i> إعدادات التطبيق
            </h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-slate-300 mb-2">رابط قائمة M3U / IPTV خاصة بك:</label>
                    <input type="text" id="m3uUrlInput" placeholder="https://example.com/playlist.m3u" tabindex="0" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-100 focus:border-brand-cyan">
                </div>
                <button onclick="loadCustomM3U()" tabindex="0" class="w-full py-3 bg-brand-cyan text-slate-950 font-bold rounded-xl shadow-lg shadow-cyan-500/20">
                    تحديث القائمة
                </button>
                <div class="pt-4 border-t border-slate-800 flex justify-between items-center text-sm text-slate-400">
                    <span>إصدار التطبيق: 2.5.0 (NovaTV Ultra)</span>
                    <button onclick="clearFavorites()" tabindex="0" class="text-red-400 hover:underline">مسح المفضلات</button>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="glass-panel border-t border-slate-800/80 py-4 px-6 text-center text-xs text-slate-400 mt-12">
        <p>NovaTV - تجربة بث ترفيهية متكاملة للتلفزيون والأجهزة المحمولة</p>
    </footer>

    <!-- Fullscreen Video Player Overlay -->
    <div id="playerOverlay" class="fixed inset-0 z-50 bg-black/95 flex flex-col items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <!-- Close Button -->
        <button onclick="closePlayer()" tabindex="0" id="closePlayerBtn" class="absolute top-6 left-6 z-50 w-12 h-12 rounded-2xl glass-panel border border-slate-700 text-white hover:text-brand-cyan text-xl flex items-center justify-center transition-all">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <!-- Player Header Details -->
        <div class="absolute top-6 right-6 z-40 glass-panel px-5 py-2.5 rounded-2xl border border-slate-800 flex items-center gap-3">
            <span class="w-2.5 h-2.5 rounded-full bg-red-500 animate-ping"></span>
            <span id="playerTitle" class="font-bold text-sm text-slate-100">اسم القناة</span>
        </div>

        <!-- Video Canvas -->
        <div class="relative w-full h-full flex items-center justify-center">
            <video id="videoPlayer" class="w-full h-full object-contain" controls autoplay></video>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        // Media Database (Live Channels, Movies, Series)
        const mediaData = {
            live: [
                {
                    category: "قنوات دينية وإخبارية",
                    items: [
                        { id: "l1", title: "القرآن الكريم (مكة)", url: "https://vs-hls-push-ww-live.live.cf.cdntv.africa/makkah/hq/index.m3u8", img: "https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=500", badge: "مباشر" },
                        { id: "l2", title: "السنة النبوية (المدينة)", url: "https://vs-hls-push-ww-live.live.cf.cdntv.africa/madinah/hq/index.m3u8", img: "https://images.unsplash.com/photo-1591604129939-f1efa4d9f7fa?q=80&w=500", badge: "مباشر" },
                        { id: "l3", title: "الجزيرة الإخبارية", url: "https://live-hls-web-aje.getaj.net/AJE/03.m3u8", img: "https://images.unsplash.com/photo-1585829365295-ab7cd400c167?q=80&w=500", badge: "أخبار" },
                        { id: "l4", title: "فرانس 24 بالعربية", url: "https://f24hls-i.akamaihd.net/hls/live/221991/F24_AR_HLS/master.m3u8", img: "https://images.unsplash.com/photo-1504711434969-e33886168f5c?q=80&w=500", badge: "أخبار" }
                    ]
                },
                {
                    category: "قنوات وثائقية ورياضية",
                    items: [
                        { id: "l5", title: "ناشونال جيوغرافيك (عينة)", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", img: "https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=500", badge: "وثائقي" },
                        { id: "l6", title: "بث المهرجانات والتغطيات", url: "https://test-streams.mux.dev/pts_shift/master.m3u8", img: "https://images.unsplash.com/photo-1461896836934-ffe607ba8211?q=80&w=500", badge: "رياضة" }
                    ]
                }
            ],
            movies: [
                {
                    category: "أحدث الأفلام المضافة",
                    items: [
                        { id: "m1", title: "رحلة الفضاء العميقة", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", img: "https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=500", badge: "4K Cinema" },
                        { id: "m2", title: "مغامرة الجبال والجليد", url: "https://test-streams.mux.dev/pts_shift/master.m3u8", img: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=500", badge: "HD" },
                        { id: "m3", title: "سر المدينة القديمة", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", img: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=500", badge: "Full HD" }
                    ]
                }
            ],
            series: [
                {
                    category: "مسلسلات حصرية",
                    items: [
                        { id: "s1", title: "عالم الغموض - الموسم الأول", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", img: "https://images.unsplash.com/photo-1514533450685-4493e01d1fdc?q=80&w=500", badge: "حلقة 1" },
                        { id: "s2", title: "صراع الأبطال", url: "https://test-streams.mux.dev/pts_shift/master.m3u8", img: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=500", badge: "جديد" }
                    ]
                }
            ]
        };

        let currentTab = 'live';
        let currentHeroItem = mediaData.live[0].items[0];
        let favorites = JSON.parse(localStorage.getItem('nova_favs') || '[]');
        let hlsInstance = null;

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            renderTab(currentTab);
            setupTVNavigation();
        });

        // Toast Notification System
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            toast.classList.remove('opacity-0', '-translate-y-4', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-4', 'pointer-events-none');
            }, 3000);
        }

        // Tab Switching Logic
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.className = "nav-btn px-5 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 transition-all text-slate-300 hover:text-white hover:bg-slate-800/60";
            });
            const activeBtn = document.getElementById(`tab-${tab}`);
            if (activeBtn) {
                activeBtn.className = "nav-btn px-5 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 transition-all bg-brand-cyan text-slate-950 shadow-lg shadow-cyan-500/20";
            }

            const settingsView = document.getElementById('settingsView');
            const contentArea = document.getElementById('contentArea');

            if (tab === 'settings') {
                settingsView.classList.remove('hidden');
                contentArea.classList.add('hidden');
            } else {
                settingsView.classList.add('hidden');
                contentArea.classList.remove('hidden');
                renderTab(tab);
            }
        }

        // Render Cards and Categories
        function renderTab(tab) {
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = '';

            let dataToRender = [];
            if (tab === 'favs') {
                dataToRender = [{ category: "قنواتي ومفضلاتي", items: favorites }];
            } else if (mediaData[tab]) {
                dataToRender = mediaData[tab];
            }

            if (dataToRender.length === 0 || (tab === 'favs' && favorites.length === 0)) {
                contentArea.innerHTML = `
                    <div class="text-center py-16 space-y-3">
                        <i class="fa-solid fa-heart-crack text-5xl text-slate-600"></i>
                        <p class="text-slate-400 font-bold">لا توجد عناصر في قائمة المفضلة حالياً.</p>
                    </div>
                `;
                return;
            }

            dataToRender.forEach(cat => {
                const section = document.createElement('div');
                section.className = 'space-y-4';

                section.innerHTML = `
                    <h2 class="text-xl font-bold text-white flex items-center gap-2">
                        <span class="w-2 h-6 bg-brand-cyan rounded-full"></span>
                        ${cat.category}
                    </h2>
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                        ${cat.items.map(item => createCardHTML(item)).join('')}
                    </div>
                `;
                contentArea.appendChild(section);
            });
        }

        function createCardHTML(item) {
            const isFav = favorites.some(f => f.id === item.id);
            return `
                <div tabindex="0" onclick="playMedia('${item.url}', '${item.title}')" class="media-card glass-card rounded-2xl overflow-hidden cursor-pointer group flex flex-col justify-between p-3 relative">
                    <div class="relative aspect-video rounded-xl overflow-hidden mb-3 bg-slate-900">
                        <img src="${item.img}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-110 transition-all duration-500">
                        <span class="absolute top-2 right-2 bg-slate-950/80 backdrop-blur-md border border-slate-700/60 text-brand-cyan text-[10px] font-black px-2 py-0.5 rounded-lg">
                            ${item.badge || 'HD'}
                        </span>
                        <button onclick="event.stopPropagation(); toggleFav('${item.id}')" class="absolute top-2 left-2 w-8 h-8 rounded-lg glass-panel flex items-center justify-center text-xs text-brand-cyan hover:scale-110 transition-all">
                            <i class="${isFav ? 'fa-solid text-red-500' : 'fa-regular'} fa-heart"></i>
                        </button>
                    </div>
                    <div>
                        <h3 class="font-bold text-sm text-slate-100 group-hover:text-brand-cyan transition-colors line-clamp-1">${item.title}</h3>
                        <p class="text-xs text-slate-400 mt-1 flex items-center gap-1">
                            <i class="fa-solid fa-play text-[10px] text-brand-cyan"></i> انقر للتشغيل
                        </p>
                    </div>
                </div>
            `;
        }

        // HLS Player Engine Integration
        function playMedia(url, title) {
            const overlay = document.getElementById('playerOverlay');
            const video = document.getElementById('videoPlayer');
            document.getElementById('playerTitle').textContent = title;

            overlay.classList.remove('hidden');
            setTimeout(() => overlay.classList.add('opacity-100'), 10);

            if (Hls.isSupported() && url.includes('.m3u8')) {
                if (hlsInstance) hlsInstance.destroy();
                hlsInstance = new Hls();
                hlsInstance.loadSource(url);
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else {
                video.src = url;
                video.play();
            }

            document.getElementById('closePlayerBtn').focus();
            showToast(`جاري تشغيل: ${title}`);
        }

        function closePlayer() {
            const overlay = document.getElementById('playerOverlay');
            const video = document.getElementById('videoPlayer');

            overlay.classList.remove('opacity-100');
            setTimeout(() => {
                overlay.classList.add('hidden');
                video.pause();
                video.src = '';
                if (hlsInstance) hlsInstance.destroy();
            }, 300);
        }

        // Hero Controls
        function playHeroStream() {
            playMedia(currentHeroItem.url, currentHeroItem.title);
        }

        function toggleHeroFav() {
            toggleFav(currentHeroItem.id);
            const isFav = favorites.some(f => f.id === currentHeroItem.id);
            const icon = document.getElementById('heroFavIcon');
            icon.className = isFav ? "fa-solid fa-heart text-base text-red-500" : "fa-regular fa-heart text-base text-brand-cyan";
        }

        // Favorite Toggle System
        function toggleFav(id) {
            let allItems = [];
            Object.keys(mediaData).forEach(k => {
                mediaData[k].forEach(cat => allItems.push(...cat.items));
            });
            const item = allItems.find(i => i.id === id);
            if (!item) return;

            const index = favorites.findIndex(f => f.id === id);
            if (index > -1) {
                favorites.splice(index, 1);
                showToast("تمت الإزالة من المفضلة");
            } else {
                favorites.push(item);
                showToast("تمت الإضافة إلى المفضلة");
            }

            localStorage.setItem('nova_favs', JSON.stringify(favorites));
            if (currentTab === 'favs') renderTab('favs');
        }

        function clearFavorites() {
            favorites = [];
            localStorage.removeItem('nova_favs');
            showToast("تم مسح جميع المفضلات");
            if (currentTab === 'favs') renderTab('favs');
        }

        // Live Search Handler
        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!query) {
                renderTab(currentTab);
                return;
            }

            let results = [];
            Object.keys(mediaData).forEach(k => {
                mediaData[k].forEach(cat => {
                    cat.items.forEach(item => {
                        if (item.title.toLowerCase().includes(query)) {
                            results.push(item);
                        }
                    });
                });
            });

            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = `
                <div class="space-y-4">
                    <h2 class="text-xl font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-magnifying-glass text-brand-cyan"></i> نتائج البحث عن: "${query}"
                    </h2>
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                        ${results.map(item => createCardHTML(item)).join('')}
                    </div>
                </div>
            `;
        }

        // Custom M3U Loader
        function loadCustomM3U() {
            const url = document.getElementById('m3uUrlInput').value.trim();
            if (!url) {
                showToast("يرجى إدخال رابط M3U صحيح");
                return;
            }
            showToast("جاري تحميل قائمة M3U الخاصة بك...");
            setTimeout(() => {
                showToast("تم تحديث القائمة بنجاح!");
                switchTab('live');
            }, 1500);
        }

        // D-Pad / Smart TV Remote Keyboard Navigation
        function setupTVNavigation() {
            document.addEventListener('keydown', (e) => {
                const focusable = Array.from(document.querySelectorAll('[tabindex="0"]:not(.hidden)'));
                if (focusable.length === 0) return;

                const active = document.activeElement;
                let index = focusable.indexOf(active);

                switch (e.key) {
                    case 'ArrowRight':
                        if (index > 0) focusable[index - 1].focus();
                        e.preventDefault();
                        break;
                    case 'ArrowLeft':
                        if (index < focusable.length - 1) focusable[index + 1].focus();
                        e.preventDefault();
                        break;
                    case 'ArrowDown':
                        if (index + 4 < focusable.length) focusable[index + 4].focus();
                        e.preventDefault();
                        break;
                    case 'ArrowUp':
                        if (index - 4 >= 0) focusable[index - 4].focus();
                        e.preventDefault();
                        break;
                    case 'Backspace':
                    case 'Escape':
                        const playerOverlay = document.getElementById('playerOverlay');
                        if (!playerOverlay.classList.contains('hidden')) {
                            closePlayer();
                            e.preventDefault();
                        }
                        break;
                }
            });
        }
    </script>
