<!DOCTYPE html>
<html lang="fr" dir="ltr" id="appHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVibe PRO - NextGen IPTV Experience</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- HLS & Three.js Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --bg-main: #05070b;
            --bg-card: #0f1624;
            --primary-blue: #00d2ff;
            --primary-glow: rgba(0, 210, 255, 0.4);
            --btn-settings: #e50914;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --border-subtle: rgba(255, 255, 255, 0.1);
        }

        [data-theme="neon"] {
            --primary-blue: #ff007f;
            --primary-glow: rgba(255, 0, 127, 0.4);
            --btn-settings: #d60060;
        }

        [data-theme="cyber"] {
            --primary-blue: #00ffcc;
            --primary-glow: rgba(0, 255, 204, 0.4);
            --btn-settings: #0088cc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Tajawal', sans-serif;
            user-select: none;
            outline: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 50px;
        }

        #webgl-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        /* شريط التنقل العلوي */
        .top-navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 40px;
            background: rgba(5, 7, 11, 0.9);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-subtle);
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
        }

        .brand-logo-3d {
            font-size: 26px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary-blue), #3a7bd5, #ff0055);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-badge {
            background: linear-gradient(135deg, #ff0055, #ff5050);
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            -webkit-text-fill-color: #fff;
        }

        .server-status-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            color: #10b981;
        }

        .green-dot {
            width: 8px; height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981;
            animation: pulse-green 1.5s infinite;
        }

        @keyframes pulse-green {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .nav-center {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.03);
            padding: 6px;
            border-radius: 30px;
            border: 1px solid var(--border-subtle);
        }

        .nav-pill {
            background: transparent;
            border: none;
            color: var(--text-sub);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-pill.active, .nav-pill:hover {
            background: var(--primary-blue);
            color: #05070b;
            font-weight: 800;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .icon-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: #fff;
            width: 44px; height: 44px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; cursor: pointer;
            transition: 0.2s;
        }

        .icon-btn:hover {
            background: var(--primary-blue);
            color: #05070b;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        /* عرض الأقسام */
        .view-section {
            display: none;
            padding: 30px 40px;
        }

        .view-section.active { display: block; }

        /* بانر سينمائي متحرك ثلاثي الأبعاد تحت القوائم */
        .hero-banner-large {
            position: relative;
            width: 100%;
            min-height: 320px;
            border-radius: 24px;
            overflow: hidden;
            background: linear-gradient(180deg, rgba(5, 7, 11, 0.2) 0%, rgba(5, 7, 11, 0.95) 100%),
                        url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1400&auto=format&fit=crop') center/cover no-repeat;
            border: 1px solid var(--border-subtle);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            margin-bottom: 35px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            animation: hero-glow 6s infinite alternate;
        }

        @keyframes hero-glow {
            0% { border-color: rgba(0, 210, 255, 0.2); }
            100% { border-color: rgba(0, 210, 255, 0.6); box-shadow: 0 0 30px var(--primary-glow); }
        }

        .hero-banner-title {
            font-size: 40px
