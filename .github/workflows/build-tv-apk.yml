name: Build StreamVibe TV APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html
          cat > patch.py << 'PYEOF'
          import sys
          p = 'www/index.html'
          s = open(p, encoding='utf-8').read()
          a = s.find('function play(c){')
          b = s.find('function scr(id,d)')
          if a < 0 or b < 0 or b < a:
              print('ERROR: play() not found')
              sys.exit(1)
          NEW = r'''function play(c){
           if(!c)return;activeUrl=c.url;showIB(c);
           const u0=c.url,u=(location.protocol==='https:'&&u0.startsWith('http://'))?u0.replace('http://','https://'):u0;
           recent=[c,...recent.filter(x=>x.url!==c.url)].slice(0,30);LS.s('recent',recent);
           if(LS.g('ext',false)){window.open(c.url,'_blank');return}
           $('np').innerHTML=`<b>${esc(c.name)}</b><span>● ${t('live')}</span>`;
           const v=$('v'),m=$('msg'),tok=play.n=(play.n||0)+1,stale=()=>tok!==play.n;
           let src=u;
           const show=x=>{m.textContent=x;m.style.display='flex'};
           const ok=()=>{if(stale())return;clearTimeout(play.t);m.style.display='none'};
           const bad=why=>{if(stale())return;clearTimeout(play.t);show(t('err')+' ['+why+']')};
           const hlsOK=!!(window.Hls&&Hls.isSupported());
           const reset=()=>{clearTimeout(play.t);if(hls){hls.destroy();hls=null}v.onerror=null;v.onplaying=null;v.pause();v.removeAttribute('src');v.load();$('qSel').innerHTML='<option value="-1">Auto</option>'};
           const timer=()=>{play.t=setTimeout(()=>{if(!stale()&&v.readyState<3)next('timeout')},12000)};
           const nat=()=>{reset();v.onplaying=ok;v.onerror=()=>next('native '+(v.error?v.error.code:''));v.src=src;v.play().catch(()=>{});timer()};
           const hp=()=>{reset();hls=new Hls({enableWorker:true,lowLatencyMode:true,manifestLoadingMaxRetry:1,levelLoadingMaxRetry:1});v.onplaying=ok;
            hls.loadSource(src);hls.attachMedia(v);
            hls.on(Hls.Events.MANIFEST_PARSED,(e,d)=>{$('qSel').innerHTML='<option value="-1">Auto</option>'+d.levels.map((l,i)=>`<option value="${i}">${l.height?l.height+'p':Math.round(l.bitrate/1000)+'k'}</option>`).join('');if(window.applyQ)applyQ();v.play().catch(()=>{})});
            let rec=0;hls.on(Hls.Events.ERROR,(e,d)=>{if(!d.fatal)return;if(d.type===Hls.ErrorTypes.MEDIA_ERROR&&!rec++){hls.recoverMediaError();return}next('hls '+d.details+(d.response?' '+d.response.code:''))});timer()};
           const order=hlsOK?[hp,nat]:[nat];
           if(u!==u0){
            if(hlsOK)order.push(()=>{src=u0;hp()});
            order.push(()=>{src=u0;nat()});
           }
           const next=why=>{if(stale())return;const f=order.shift();f?f():bad(why)};
           show(t('loading'));next();LS.s('last',c);renderCh();
          }
          '''
          s = s[:a] + NEW + s[b:]
          open(p, 'w', encoding='utf-8').write(s)
          print('patched OK')
          PYEOF
          python3 patch.py

      - name: Fix remote navigation
        run: |
          python3 - << 'PYEOF'
          import sys
          p = 'www/index.html'
          s = open(p, encoding='utf-8').read()
          old = r"""if(order[j]){go(items(order[j])[0]);e.preventDefault()}"""
          new = r"""{const st=(k==='ArrowRight'?1:-1);let jj=order.indexOf(z)+st,tg=null;while(order[jj]&&!tg){const it=items(order[jj]);if(it.length)tg=it[0];jj+=st}if(tg){go(tg);e.preventDefault()}}"""
          if s.count(old) != 1:
              print('ERROR: navigation code not found')
              sys.exit(1)
          s = s.replace(old, new)
          open(p, 'w', encoding='utf-8').write(s)
          print('navigation fixed')
          PYEOF

      - name: Add back button handling
        run: |
          python3 - << 'PYEOF'
          import sys
          p = 'www/index.html'
          s = open(p, encoding='utf-8').read()
          JS = r'''
          (function(){
           var A=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.App;
           if(!A)return;
           var vis=function(id){var e=document.getElementById(id);return !!(e&&e.style.display&&e.style.display!=='none')};
           A.addListener('backButton',function(){
            var v=document.getElementById('v'),pv=document.getElementById('pvv');
            if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return}
            if(v&&v.webkitDisplayingFullscreen){v.webkitExitFullscreen();return}
            if(pv&&pv.webkitDisplayingFullscreen){pv.webkitExitFullscreen();return}
            var ms=['mPin','mPl','mLang'];
            for(var i=0;i<ms.length;i++){if(vis(ms[i])){closeM(ms[i]);return}}
            if(vis('pv')){closePv();return}
            if(vis('lib')){closeLib();return}
            if(vis('live')){var sd=document.getElementById('side');if(sd.classList.contains('show')){sd.classList.remove('show')}else{closeLive()}return}
            if(vis('settings')){document.getElementById('settings').style.display='none';return}
            A.exitApp();
           });
          })();
          '''
          if '</body>' not in s:
              print('ERROR: body end not found')
              sys.exit(1)
          s = s.replace('</body>', '<script>' + JS + '</script></body>', 1)
          open(p, 'w', encoding='utf-8').write(s)
          print('back handler added')
          PYEOF

      - name: Add quality control
        run: |
          python3 - << 'PYEOF'
          import sys
          p = 'www/index.html'
          s = open(p, encoding='utf-8').read()
          old = '<button class="cb" onclick="fs()">⛶</button>'
          if s.count(old) != 1:
              print('ERROR: fullscreen button not found')
              sys.exit(1)
          s = s.replace(old, '<button class="cb" id="bQ" onclick="cycleQ()">HD</button>' + old)
          JS = r'''
          (function(){
           window.lbl=function(){
            var b=document.getElementById('bQ');if(!b)return;
            if(!hls||!hls.levels||!hls.levels.length){b.textContent='HD';return}
            if(hls.autoLevelEnabled){b.textContent='Auto';return}
            var l=hls.levels[hls.currentLevel],h=l&&l.height;
            b.textContent=h?(h>=1080?'FHD ':h>=720?'HD ':'')+h+'p':'HD';
           };
           window.applyQ=function(){
            if(!hls||!hls.levels||!hls.levels.length)return;
            var L=hls.levels,p=LS.g('prefQ',99999),i,best=-1,bk=-1,mk=1e15,mi=0;
            if(p===0){hls.currentLevel=-1;document.getElementById('qSel').value='-1';window.lbl();return}
            for(i=0;i<L.length;i++){
             var h=L[i].height||0,k=h*1e9+(L[i].bitrate||0);
             if(k<mk){mk=k;mi=i}
             if(h<=p&&k>bk){bk=k;best=i}
            }
            if(best<0)best=mi;
            hls.currentLevel=best;
            document.getElementById('qSel').value=String(best);
            window.lbl();
           };
           window.cycleQ=function(){
            if(!hls||!hls.levels||hls.levels.length<2){toast('1 / 1');return}
            var hs=[];
            hls.levels.forEach(function(l){var h=l.height||0;if(h&&hs.indexOf(h)<0)hs.push(h)});
            hs.sort(function(a,b){return b-a});
            if(!hs.length){
             hls.currentLevel=hls.autoLevelEnabled?hls.levels.length-1:hls.currentLevel-1;
             window.lbl();toast(document.getElementById('bQ').textContent);return;
            }
            var opts=hs.concat([0]),cur=0;
            if(hls.autoLevelEnabled){cur=opts.length-1}
            else{var ch=hls.levels[hls.currentLevel];cur=Math.max(0,opts.indexOf((ch&&ch.height)||0))}
            var nx=opts[(cur+1)%opts.length];
            LS.s('prefQ',nx===hs[0]?99999:nx);
            window.applyQ();
            toast(document.getElementById('bQ').textContent);
           };
           window.setQ=function(i){
            if(!hls)return;i=+i;hls.currentLevel=i;
            if(i<0){LS.s('prefQ',0)}else{LS.s('prefQ',hls.levels[i].height||99999)}
            window.lbl();
           };
          })();
          '''
          s = s.replace('</body>', '<script>' + JS + '</script></body>', 1)
          open(p, 'w', encoding='utf-8').write(s)
          print('quality control added')
          PYEOF

      - name: Create Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.streamvibe.tv",
            "appName": "StreamVibe",
            "webDir": "www",
            "server": { "androidScheme": "http", "cleartextTraffic": true },
            "plugins": { "CapacitorHttp": { "enabled": true } }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Configure for Android TV and http
        run: |
          python3 - << 'PYEOF'
          f = 'android/app/src/main/AndroidManifest.xml'
          s = open(f, encoding='utf-8').read()
          s = s.replace('<application', '<uses-feature android:name="android.software.leanback" android:required="false" />\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n    <application android:usesCleartextTraffic="true"', 1)
          s = s.replace('<category android:name="android.intent.category.LAUNCHER" />', '<category android:name="android.intent.category.LAUNCHER" />\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />', 1)
          open(f, 'w', encoding='utf-8').write(s)
          print(s)
          PYEOF

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: StreamVibe-TV-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
