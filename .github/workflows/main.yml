
name: Build Nova TV APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No ZIP project file found in repository root."
            exit 1
          fi

          echo "Using project archive: $ZIP_FILE"

          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          APP_GRADLE="$(find project -type f \
            \( -path '*/app/build.gradle.kts' \
            -o -path '*/app/build.gradle' \) \
            -print -quit)"

          if [ -z "$APP_GRADLE" ]; then
            echo "::error::Cannot find app/build.gradle.kts or app/build.gradle inside ZIP."
            echo "Extracted files:"
            find project -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$(dirname "$APP_GRADLE")")"
          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Android project: $PROJECT_DIR"

      - name: Update Media3 dependencies
        run: |
          find "$PROJECT_DIR" -type f \
            \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "*.toml" \) \
            -exec sed -i 's/1\.5\.1/1.6.1/g' {} +

      - name: Fix Java and Kotlin compatibility
        shell: bash
        run: |
          FILE="$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$FILE" ]; then
            echo "Kotlin Gradle file not found; checking Groovy Gradle file."
            FILE="$PROJECT_DIR/app/build.gradle"
          fi

          if [ ! -f "$FILE" ]; then
            echo "::error::App Gradle file not found."
            exit 1
          fi

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          s = s.replace(
              'JavaVersion.VERSION_1_8',
              'JavaVersion.VERSION_17'
          )
          s = s.replace(
              'jvmTarget = "1.8"',
              'jvmTarget = "17"'
          )
          s = s.replace(
              'jvmTarget = "8"',
              'jvmTarget = "17"'
          )

          p.write_text(s)
          print(f"Updated compatibility settings in {p}")
          PY

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-TV-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
