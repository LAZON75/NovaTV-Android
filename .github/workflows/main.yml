
name: Build Nova TV APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NovaTV-Android-Studio-v2.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          unzip -q NovaTV-Android-Studio-v2.zip -d project
          test -f project/NovaTV-Android-Studio/app/build.gradle.kts

      - name: Update Media3 dependencies
        run: |
          find project/NovaTV-Android-Studio -type f \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "*.toml" \) -exec sed -i 's/1\.5\.1/1.6.1/g' {} +

      - name: Fix Java and Kotlin compatibility
        run: |
          FILE="project/NovaTV-Android-Studio/app/build.gradle.kts"
          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          s = s.replace(
              'JavaVersion.VERSION_1_8',
              'JavaVersion.VERSION_17'
          )
          s = s.replace(
              'jvmTarget = "1.8"',
              'jvmTarget = "17"'
          )
          s = s.replace(
              'jvmTarget = "8"',
              'jvmTarget = "17"'
          )

          if 'compileOptions {' not in s:
              s += '''
          
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          '''

          if 'kotlinOptions {' not in s and 'jvmToolchain(17)' not in s:
              s += '''

          kotlin {
              jvmToolchain(17)
          }
          '''

          p.write_text(s)
          print("Java/Kotlin compatibility updated.")
          PY

      - name: Build APK
        working-directory: project/NovaTV-Android-Studio
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-TV-APK
          path: project/NovaTV-Android-Studio/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
