
name: Build Nova TV APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android packages
        shell: bash
        run: |
          set -e
          set +o pipefail

          yes | sdkmanager --licenses
          LICENSE_STATUS=$?

          set -o pipefail

          if [ "$LICENSE_STATUS" -ne 0 ]; then
            echo "::error::Android SDK license acceptance failed."
            exit 1
          fi

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="NovaTV-Neon-Edition-Project.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 1 -type f \
              -iname '*.zip' -print -quit)"
          fi

          if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Project ZIP not found."
            ls -la
            exit 1
          fi

          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          APP_GRADLE="$(find project -type f \
            \( -path '*/app/build.gradle.kts' \
            -o -path '*/app/build.gradle' \) \
            -print -quit)"

          if [ -z "$APP_GRADLE" ]; then
            echo "::error::Android Gradle file not found in ZIP."
            find project -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$(dirname "$APP_GRADLE")")"
          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Fix Java and Kotlin compatibility
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$PROJECT_DIR" <<'PY'
          import re
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])

          for p in root.rglob("*"):
              if not p.is_file() or p.name not in (
                  "build.gradle",
                  "build.gradle.kts"
              ):
                  continue

              s = p.read_text()
              original = s

              s = re.sub(
                  r'JavaVersion\.VERSION_(?:1_8|8|11)',
                  'JavaVersion.VERSION_17',
                  s
              )

              s = re.sub(
                  r'jvmTarget\s*=\s*["\'](?:1\.8|8|11)["\']',
                  'jvmTarget = "17"',
                  s
              )

              if s != original:
                  p.write_text(s)
                  print(f"Updated: {p}")

          app = root / "app"
          gradle_file = (
              app / "build.gradle.kts"
              if (app / "build.gradle.kts").exists()
              else app / "build.gradle"
          )

          if not gradle_file.exists():
              raise SystemExit("App Gradle file not found.")

          print("Java/Kotlin compatibility check completed.")
          PY

      - name: Diagnose Media3 dependencies
        shell: bash
        run: |
          set -euo pipefail

          grep -RInE \
            'media3-ui-compose|media3-ui:|media3Version|media3_version' \
            "$PROJECT_DIR" \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            --include='*.toml' || true

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-TV-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
