
name: Build Nova TV APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NovaTV-Android-Studio.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          unzip -q NovaTV-Android-Studio.zip -d project
          test -f project/NovaTV-Android-Studio/app/build.gradle.kts

      - name: Build APK
        working-directory: project/NovaTV-Android-Studio
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Nova-TV-APK
          path: project/NovaTV-Android-Studio/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
