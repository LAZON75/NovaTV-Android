
name: Build Nova TV APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="NovaTV-Neon-Edition-Project.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          fi

          if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "::error::No project ZIP found in repository root."
            ls -la
            exit 1
          fi

          echo "Extracting: $ZIP_FILE"
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          APP_GRADLE="$(find project -type f \
            \( -path '*/app/build.gradle.kts' \
            -o -path '*/app/build.gradle' \) \
            -print -quit)"

          if [ -z "$APP_GRADLE" ]; then
            echo "::error::No Android app Gradle file found in ZIP."
            find project -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$(dirname "$APP_GRADLE")")"
          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Fix Java and Kotlin compatibility
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$PROJECT_DIR" <<'PY'
          import re
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          app = root / "app"

          files = [
              app / "build.gradle.kts",
              app / "build.gradle",
          ]

          found = False

          for p in files:
              if not p.is_file():
                  continue

              found = True
              s = p.read_text()

              # Update common Java compatibility declarations.
              s = re.sub(
                  r'JavaVersion\.VERSION_(?:1_8|8|11|17)',
                  'JavaVersion.VERSION_17',
                  s
              )

              # Update existing Kotlin JVM target declarations.
              s = re.sub(
                  r'jvmTarget\s*=\s*["\'](?:1\.8|8|11|17)["\']',
                  'jvmTarget = "17"',
                  s
              )

              # Configure Java compatibility if absent.
              if "compileOptions {" not in s:
                  block = (
                      "\n    compileOptions {\n"
                      "        sourceCompatibility = "
                      "JavaVersion.VERSION_17\n"
                      "        targetCompatibility = "
                      "JavaVersion.VERSION_17\n"
                      "    }\n"
                  )

                  if p.name == "build.gradle":
                      block = (
                          "\n    compileOptions {\n"
                          "        sourceCompatibility "
                          "JavaVersion.VERSION_17\n"
                          "        targetCompatibility "
                          "JavaVersion.VERSION_17\n"
                          "    }\n"
                      )

                  match = re.search(r'(?m)^android\s*\{', s)

                  if match:
                      s = s[:match.end()] + block + s[match.end():]
                  else:
                      raise SystemExit(
                          f"No android block found in {p}"
                      )

              # For Kotlin DSL, add a JVM toolchain if no target
              # declaration or toolchain is present.
              if p.name.endswith(".kts") and "jvmToolchain(" not in s:
                  if "kotlin {" not in s:
                      s += "\n\nkotlin {\n    jvmToolchain(17)\n}\n"

              p.write_text(s)
              print(f"Updated compatibility settings: {p}")

          if not found:
              raise SystemExit("App Gradle build file not found.")
          PY

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          echo "APK successfully generated: $APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-TV-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
