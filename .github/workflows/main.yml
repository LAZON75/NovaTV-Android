
name: Build Nova TV APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NovaTV-Android-Studio.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          unzip -q NovaTV-Android-Studio.zip -d project
          find project -name build.gradle.kts
          test -f project/NovaTV-Android-Studio/app/build.gradle.kts

      - name: Build APK
        working-directory: project/NovaTV-Android-Studio
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-TV-APK
          path: project/NovaTV-Android-Studio/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
