
name: Build Nova TV APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi

          if [ -z "${SDKMANAGER:-}" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: Android sdkmanager was not found on the runner."
            echo "Available SDK directories:"
            ls -la "$ANDROID_HOME" || true
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find and extract Nova TV project ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/project"

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -iname '*.zip' ! -path '*/project/*' | sort | head -n 1)"

          if [ -z "${ZIP_FILE:-}" ]; then
            echo "ERROR: No project ZIP found in the repository."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          unzip -q -o "$ZIP_FILE" -d "$GITHUB_WORKSPACE/project"

          APP_GRADLE="$(find "$GITHUB_WORKSPACE/project" -type f \( -name 'build.gradle.kts' -o -name 'build.gradle' \) -path '*/app/*' | head -n 1)"

          if [ -z "${APP_GRADLE:-}" ]; then
            echo "ERROR: app/build.gradle was not found inside the ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$(dirname "$APP_GRADLE")")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"

      - name: Fix Java and Kotlin targets
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])

          candidates = [
              root / "app" / "build.gradle.kts",
              root / "app" / "build.gradle"
          ]

          gradle_file = next(
              (p for p in candidates if p.is_file()),
              None
          )

          if gradle_file is None:
              raise SystemExit("ERROR: app Gradle file was not found.")

          text = gradle_file.read_text(encoding="utf-8")

          # Remove the dependency that caused the earlier Media3 error.
          text = "\n".join(
              line for line in text.splitlines()
              if "androidx.media3:media3-ui-compose" not in line
          ) + "\n"

          # Align Java versions.
          text = re.sub(
              r"JavaVersion\.VERSION_(?:1_8|8|11|17)",
              "JavaVersion.VERSION_17",
              text
          )

          # Align Kotlin JVM target.
          text = re.sub(
              r'jvmTarget\s*=\s*["\'][^"\']+["\']',
              'jvmTarget = "17"',
              text
          )

          if "compileOptions" not in text:
              match = re.search(r"android\s*\{", text)

              if not match:
                  raise SystemExit("ERROR: Android configuration block not found.")

              addition = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              """

              text = text[:match.end()] + addition + text[match.end():]

          if "kotlinOptions" not in text:
              match = re.search(r"android\s*\{", text)

              if not match:
                  raise SystemExit("ERROR: Android configuration block not found.")

              addition = """
              kotlinOptions {
                  jvmTarget = "17"
              }
              """

              text = text[:match.end()] + addition + text[match.end():]

          gradle_file.write_text(text, encoding="utf-8")
          print("Updated Java and Kotlin targets.")
          PY

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' | head -n 1)"

          if [ -z "${APK_PATH:-}" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK_PATH" "$GITHUB_WORKSPACE/output/NovaTV-debug.apk"

          echo "APK created successfully."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaTV-debug-APK
          path: output/NovaTV-debug.apk
          if-no-files-found: error
